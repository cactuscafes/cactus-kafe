name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    # Sadece @claude geçen yorumlarda veya claude etiketi/atamasında çalış
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || github.event.action == 'assigned' || github.event.action == 'labeled'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CI loglarını okuyabilsin (hata ayıklama istekleri için)
          additional_permissions: |
            actions: read
          prompt: |
            Depo; statik HTML/CSS/JS sayfaları (adisyon, admin, menü, oyunlar)
            ve Cloudflare Workers backend'i (app/, src/, wrangler.toml) içeriyor.
            Build adımı yok, dosyalar doğrudan yayına gidiyor - bu yüzden
            değişikliklerde dikkatli ol.

            Türkçe yanıt ver.
