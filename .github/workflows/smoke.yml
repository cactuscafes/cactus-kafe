name: Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Recete dusumu testi
        run: |
          echo "1) GET stok (Test Urun yapilabilir=50 beklenir: 100 shot / 2)"
          curl -sS "https://cactus-kafe.batuhanbulut.workers.dev/api/stok?sube=fsm" | python3 -c "import json,sys; d=json.load(sys.stdin); print([u for u in d['urunler'] if u['id']=='__urun_r']); print([h for h in d.get('hammaddeler',[]) if h['id']=='ham_test'])"
          EVID="rec-test-$(date +%s)"
          BODY="{\"events\":[{\"id\":\"$EVID\",\"sube\":\"fsm\",\"type\":\"MASA_PAY\",\"masa\":99,\"payload\":{\"urunler\":[{\"id\":\"__urun_r\",\"adet\":3}],\"tutar\":0},\"ts\":$(date +%s)000,\"cihaz_id\":\"smoke-recete\"}]}"
          echo "2) MASA_PAY: 3 x Test Urun (6 shot dusmeli)"
          curl -sS -X POST "https://cactus-kafe.batuhanbulut.workers.dev/api/events" -H "Content-Type: application/json" -d "$BODY"
          echo
          sleep 3
          echo "3) AYNI event tekrar (retry — dusmemeli)"
          curl -sS -X POST "https://cactus-kafe.batuhanbulut.workers.dev/api/events" -H "Content-Type: application/json" -d "$BODY"
          echo
          sleep 3
          echo "4) GET stok (beklenen: ham_test 94 shot, yapilabilir 47)"
          curl -sS "https://cactus-kafe.batuhanbulut.workers.dev/api/stok?sube=fsm" | python3 -c "import json,sys; d=json.load(sys.stdin); print([u for u in d['urunler'] if u['id']=='__urun_r']); print([h for h in d.get('hammaddeler',[]) if h['id']=='ham_test'])"
