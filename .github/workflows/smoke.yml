name: Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Stok dusumu + idempotens testi
        run: |
          EVID="stok-test-$(date +%s)"
          BODY="{\"events\":[{\"id\":\"$EVID\",\"sube\":\"fsm\",\"type\":\"MASA_PAY\",\"masa\":99,\"payload\":{\"urunler\":[{\"id\":\"__stok_test\",\"adet\":2}],\"tutar\":0},\"ts\":$(date +%s)000,\"cihaz_id\":\"smoke-stok\"}]}"
          echo "1) MASA_PAY gonder (2 adet dusmeli)"
          curl -sS -X POST "https://cactus-kafe.batuhanbulut.workers.dev/api/events" -H "Content-Type: application/json" -d "$BODY"
          echo
          sleep 3
          echo "2) AYNI event tekrar (retry simulasyonu — DUSMEMELI)"
          curl -sS -X POST "https://cactus-kafe.batuhanbulut.workers.dev/api/events" -H "Content-Type: application/json" -d "$BODY"
          echo
          sleep 3
          echo "3) Stok durumu (beklenen: Stok Testi adet=3)"
          curl -sS "https://cactus-kafe.batuhanbulut.workers.dev/api/stok?sube=fsm"
          echo
