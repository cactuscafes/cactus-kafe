<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e3d2a">
<title>Cactus Adisyon — Şube</title>
<link rel="apple-touch-icon" href="/favicon.svg">
<!-- ═══ UYGULAMA GİRİŞ KAPISI ═══
     Cactus Adisyon mobil uygulaması (Capacitor kabuğu) HER AÇILIŞTA burayı yükler.
     Görevi tek: cihazın şubesini hatırlayıp doğru adisyon sayfasına atmak.
     Şube seçimi localStorage'da (cactus_app_sube) durur; ikinci açılıştan sonra
     bu ekran görünmez, doğrudan geçiş olur.
     Şube değiştirmek için: /adisyon-app.html?sec=1  (adisyon içindeki "⇄ Şube" düğmesi
     buraya getirir). Uygulama dışı tarayıcıdan da açılabilir, zararsızdır. -->
<script>
(function(){
  var LK='cactus_app_sube';
  var HEDEF={ podyum:'/adisyon.html', fsm:'/adisyon-fsm.html' };
  var zorla=location.search.indexOf('sec=1')>=0;
  var url=null;
  try{
    var q=(location.search.match(/[?&]sube=(podyum|fsm)/)||[])[1];
    if(q){ localStorage.setItem(LK,q); url=HEDEF[q]; }
    else if(!zorla){ var s=localStorage.getItem(LK); if(s&&HEDEF[s]) url=HEDEF[s]; }
  }catch(e){}
  if(url) location.replace(url);   // seçim biliniyor → ekran hiç çizilmeden geç
})();
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0e3d2a;color:#fdfaf3;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:28px;
       -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  .kutu{width:100%;max-width:380px;text-align:center}
  .mrk{font-size:22px;letter-spacing:8px;text-transform:uppercase;font-weight:600}
  .alt{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#c8a86a;margin-top:6px}
  .bas{font-size:14px;color:rgba(253,250,243,.7);margin:30px 0 16px}
  button{display:block;width:100%;padding:20px;margin-bottom:12px;border:1.5px solid #c8a86a;
         border-radius:14px;background:rgba(253,250,243,.06);color:#fdfaf3;font:inherit;
         font-size:17px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:.15s}
  button:active{background:#c8a86a;color:#0e3d2a;transform:scale(.98)}
  .not{font-size:11px;color:rgba(253,250,243,.45);margin-top:22px;line-height:1.6}
</style>
</head>
<body>
<div class="kutu">
  <div class="mrk">CACTUS</div>
  <div class="alt">Adisyon</div>
  <div class="bas">Bu cihaz hangi şubede kullanılacak?</div>
  <button onclick="sec('podyum')">Podyum Park</button>
  <button onclick="sec('fsm')">FSM</button>
  <div class="not">Seçim bu cihazda kalıcıdır.<br>Değiştirmek için adisyon ekranındaki <b>⇄ Şube</b> düğmesini kullanın.</div>
</div>
<script>
function sec(s){
  try{ localStorage.setItem('cactus_app_sube',s); }catch(e){}
  location.replace(s==='fsm'?'/adisyon-fsm.html':'/adisyon.html');
}
</script>
</body>
</html>
