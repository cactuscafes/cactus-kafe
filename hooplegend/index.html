<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoop Legend">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" type="image/png" href="ikon-192.png">
<title>Hoop Legend</title>
<style>
:root{
  --bg:#14110f; --panel:#1e1a17; --panel2:#272220; --cizgi:#38312c;
  --turuncu:#f97316; --turuncu2:#fb923c; --altin:#fbbf24;
  --yesil:#34d399; --mavi:#60a5fa; --mor:#c084fc; --kirmizi:#f87171;
  --yazi:#f7f2ec; --soluk:#a89f95; --cokSoluk:#6f665d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--yazi);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
svg{display:block}
#uygulama{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

/* ---------- ÜST BAR ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#221d1a 0%,#1a1614 100%);
  border-bottom:1px solid var(--cizgi);
  padding:calc(env(safe-area-inset-top) + 9px) 11px 9px;
}
.oyuncuSatir{display:flex;align-items:center;gap:9px}
.avatar{
  width:46px;height:46px;border-radius:13px;flex:0 0 auto;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#f97316,#c2410c);border:2px solid #7c2d12;
}
.avatar svg{width:100%;height:100%}
.avatar .no{
  position:absolute;right:-1px;bottom:-1px;background:#1a1310;color:#fbbf24;
  font-size:9px;font-weight:800;padding:1px 3px;border-radius:5px 0 0 0;
}
.oyuncuBilgi{flex:1;min-width:0}
.oyuncuAd{font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligAd{font-size:11px;color:var(--soluk);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovrKutu{text-align:center;background:var(--panel2);border:1px solid var(--cizgi);border-radius:12px;padding:3px 9px;min-width:54px}
.ovrKutu .s{font-size:8.5px;color:var(--soluk);letter-spacing:.7px}
.ovrKutu .b{font-size:20px;font-weight:800;line-height:1.05;color:var(--altin)}

.kaynaklar{display:flex;gap:5px;margin-top:9px}
.kaynak{flex:1;background:var(--panel2);border:1px solid var(--cizgi);border-radius:10px;padding:5px 6px;min-width:0;display:flex;align-items:center;gap:5px}
.kaynak .ik{width:20px;height:20px;flex:0 0 auto}
.kaynak .sag{min-width:0;flex:1}
.kaynak .deg{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.kaynak .hiz{font-size:9px;color:var(--cokSoluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-para .deg{color:var(--yesil)} .k-ap .deg{color:var(--mavi)} .k-un .deg{color:var(--mor)}

/* ---------- İÇERİK ---------- */
main{flex:1;padding:11px 11px 96px;overflow-x:hidden}
.baslik{font-size:10.5px;letter-spacing:1.1px;color:var(--soluk);font-weight:800;margin:15px 2px 8px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.baslik:first-child{margin-top:0}
.baslik span{flex:1;height:1px;background:var(--cizgi)}
.kart{background:var(--panel);border:1px solid var(--cizgi);border-radius:14px;padding:11px;margin-bottom:9px}
.ipucu{font-size:11.5px;color:var(--soluk);line-height:1.55}

/* sahne */
.sahne{
  position:relative;border-radius:16px;overflow:hidden;margin-bottom:11px;
  border:1px solid var(--cizgi);background:#0e0c0b;aspect-ratio:340/200;
}
.sahne .arka{position:absolute;inset:0}
.sahne canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sahneEtiket{z-index:3}
.sahne .arka svg{width:100%;height:100%}
.sahne .oyuncu{position:absolute;left:47%;bottom:3%;width:21%;transform:translateX(-50%);transform-origin:bottom center}
.sahne .oyuncu.zipla{animation:zipla .5s ease}
@keyframes zipla{0%{transform:translateX(-50%) translateY(0)}35%{transform:translateX(-50%) translateY(-14%)}100%{transform:translateX(-50%) translateY(0)}}
.ucanTop{position:absolute;left:56%;bottom:38%;width:9%;pointer-events:none;animation:atisUcus .6s cubic-bezier(.25,.1,.5,1) forwards}
@keyframes atisUcus{
  0%{transform:translate(0,0) scale(1) rotate(0)}
  65%{transform:translate(-14%,-115%) scale(.8) rotate(220deg)}
  100%{transform:translate(-10%,-80%) scale(.55) rotate(320deg);opacity:0}
}
.ucanYazi{
  position:absolute;left:50%;bottom:42%;transform:translateX(-50%);
  font-weight:900;font-size:15px;color:#7dd3fc;pointer-events:none;
  animation:ucus 1s ease-out forwards;text-shadow:0 2px 0 #0b1220,0 0 12px #0ea5e9;
}
@keyframes ucus{0%{opacity:1;transform:translate(-50%,0) scale(.8)}25%{transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
.sahneEtiket{
  position:absolute;left:8px;top:8px;background:rgba(12,10,9,.72);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:3px 8px;font-size:10px;font-weight:800;letter-spacing:.4px;backdrop-filter:blur(6px);
}

.antrenmanBtn{
  width:100%;padding:16px;border:none;border-radius:16px;
  background:linear-gradient(160deg,#fb923c,#ea580c);
  color:#fff;font-size:16.5px;font-weight:900;letter-spacing:.4px;
  box-shadow:0 6px 0 #9a3412, 0 10px 22px rgba(249,115,22,.28);
  cursor:pointer;transition:transform .06s,box-shadow .06s;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.antrenmanBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #9a3412}
.antrenmanBtn .bIk{width:26px;height:26px;flex:0 0 auto}
.antrenmanBtn small{display:block;font-size:10.5px;font-weight:700;opacity:.92;letter-spacing:0}

/* satırlar */
.satir{
  display:flex;align-items:center;gap:9px;
  background:var(--panel);border:1px solid var(--cizgi);border-radius:14px;
  padding:9px 10px;margin-bottom:7px;
}
.satir.kilit{opacity:.42;filter:grayscale(.7)}
.satirIkon{
  width:44px;height:44px;flex:0 0 auto;border-radius:12px;padding:4px;
  background:linear-gradient(160deg,#2f2926,#231f1c);border:1px solid var(--cizgi);
}
.satirIkon svg{width:100%;height:100%}
.satirOrta{flex:1;min-width:0}
.satirAd{font-size:13px;font-weight:800;display:flex;align-items:center;gap:5px}
.satirAlt{font-size:10.5px;color:var(--soluk);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rozetSayi{font-size:9.5px;background:var(--panel2);border:1px solid var(--cizgi);border-radius:6px;padding:1px 5px;color:var(--soluk);font-weight:800}
.alBtn{
  flex:0 0 auto;min-width:84px;padding:8px 7px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--cizgi);color:var(--yazi);
  font-size:11px;font-weight:800;cursor:pointer;line-height:1.3;transition:transform .06s;
}
.alBtn:active{transform:scale(.95)}
.alBtn.aktif{background:linear-gradient(160deg,#22c55e,#15803d);border-color:#16a34a;color:#fff}
.alBtn.aktifTuruncu{background:linear-gradient(160deg,#fb923c,#ea580c);border-color:var(--turuncu);color:#fff}
.alBtn.aktifMor{background:linear-gradient(160deg,#a855f7,#7e22ce);border-color:#a855f7;color:#fff}
.alBtn:disabled{opacity:.4;cursor:default}
.alBtn small{display:block;font-size:9px;font-weight:700;opacity:.9}

/* çarpan */
/* ödüllü reklam düğmesi */
.reklamBtn{
  width:100%;display:flex;align-items:center;gap:10px;margin-bottom:9px;
  background:linear-gradient(160deg,#2563eb,#1e3a8a);border:1px solid #3b82f6;
  border-radius:14px;padding:10px 12px;color:#fff;cursor:pointer;
  box-shadow:0 4px 0 #172554;transition:transform .06s,box-shadow .06s;
}
.reklamBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #172554}
.reklamBtn:disabled{opacity:.6;cursor:default}
.reklamBtn.acik{background:linear-gradient(160deg,#0f766e,#134e4a);border-color:#14b8a6;box-shadow:0 4px 0 #0b3b38}
.reklamBtn .oynat{width:32px;height:32px;flex:0 0 auto}
.reklamBtn .met{flex:1;text-align:left;min-width:0}
.reklamBtn .b1{font-size:12.5px;font-weight:800;display:block}
.reklamBtn .b2{font-size:10px;opacity:.88;margin-top:1px}
.bonusRoz{
  display:inline-flex;align-items:center;gap:3px;background:#1d4ed8;color:#fff;
  border-radius:6px;padding:1px 5px;font-size:9px;font-weight:800;margin-left:5px;vertical-align:1px;
}
.bonusRoz.para{background:#15803d}
.carpanBar{display:flex;gap:5px;margin-bottom:9px}
.carpanBar button{
  flex:1;padding:7px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--panel);color:var(--soluk);font-weight:800;font-size:11.5px;cursor:pointer;
}
.carpanBar button.secili{background:var(--turuncu);border-color:var(--turuncu);color:#fff}

/* vitrin kartları */
.vitrin{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.vKart{
  background:var(--panel);border:1px solid var(--cizgi);border-radius:15px;overflow:hidden;
  display:flex;flex-direction:column;
}
.vKart.sahip{border-color:#16a34a}
.vKart.kilit{opacity:.5;filter:grayscale(.75)}
.vGorsel{aspect-ratio:4/3;background:linear-gradient(170deg,#3a3330,#241f1d);position:relative;padding:6px}
.vGorsel svg{width:100%;height:100%}
.vGorsel .etiket{
  position:absolute;top:5px;left:5px;font-size:8.5px;font-weight:900;letter-spacing:.4px;
  background:#16a34a;color:#fff;padding:2px 6px;border-radius:6px;
}
.vGovde{padding:8px 9px 9px}
.vAd{font-size:12px;font-weight:800;line-height:1.25}
.vEtki{font-size:10px;color:var(--yesil);font-weight:700;margin-top:2px}
.vBtn{
  width:100%;margin-top:7px;padding:8px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--panel2);color:var(--yazi);font-size:11px;font-weight:800;cursor:pointer;
}
.vBtn.aktif{background:linear-gradient(160deg,#22c55e,#15803d);border-color:#16a34a;color:#fff}
.vBtn:disabled{opacity:.5}

/* maç */
.macKart{background:var(--panel);border:1px solid var(--cizgi);border-radius:16px;padding:12px;margin-bottom:9px}
.karsilasma{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.taraf{flex:1;text-align:center;min-width:0}
.taraf .fig{height:110px;display:flex;align-items:flex-end;justify-content:center}
.taraf .fig svg{height:100%;width:auto}
.taraf .ad{font-size:11px;color:var(--soluk);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taraf .guc{font-size:19px;font-weight:900;line-height:1.1}
.vsRoz{
  font-size:11px;font-weight:900;color:#1a1310;background:var(--altin);
  border-radius:8px;padding:3px 7px;margin-bottom:34px;
}
.bar{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:11px;border:1px solid var(--cizgi)}
.barIc{height:100%;background:linear-gradient(90deg,#fb923c,#fbbf24);width:0%;transition:width .12s linear}
.macAlt{display:flex;justify-content:space-between;font-size:10.5px;color:var(--soluk);margin-top:5px}
.log{font-size:11px;line-height:1.75;color:var(--soluk);max-height:200px;overflow:hidden}
.log b{color:var(--yazi);font-weight:800}
.log .g{color:var(--yesil)} .log .m{color:var(--kirmizi)} .log .p{color:var(--altin)}

.terfiKart{background:linear-gradient(150deg,#2e2013,#1e1a17);border:1px solid #7c4a12;border-radius:16px;padding:12px;margin-bottom:9px}
.buyukBtn{
  width:100%;margin-top:9px;padding:13px;border:none;border-radius:13px;
  background:linear-gradient(160deg,#fbbf24,#d97706);color:#231a08;
  font-size:14.5px;font-weight:900;cursor:pointer;
}
.buyukBtn:disabled{background:var(--panel2);color:var(--cokSoluk);border:1px solid var(--cizgi)}
.buyukBtn.mor{background:linear-gradient(160deg,#a855f7,#7e22ce);color:#fff}
.buyukBtn.mor:disabled{background:var(--panel2);color:var(--cokSoluk)}

/* sağdan sola dillerde sahne ve sayı hizaları LTR kalsın */
[dir="rtl"] .sahne,[dir="rtl"] .vGorsel,[dir="rtl"] .taraf .fig{direction:ltr}
[dir="rtl"] .satirAlt,[dir="rtl"] .kaynak .deg,[dir="rtl"] .kaynak .hiz{unicode-bidi:plaintext}
.dilIzgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.dilBtn{
  padding:8px 6px;border-radius:9px;border:1px solid var(--cizgi);background:var(--panel2);
  color:var(--soluk);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dilBtn.secili{background:var(--turuncu);border-color:var(--turuncu);color:#fff}
.izgara{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.izgara .hucre{background:var(--panel2);border:1px solid var(--cizgi);border-radius:11px;padding:8px}
.izgara .hucre .e{font-size:9.5px;color:var(--soluk)}
.izgara .hucre .d{font-size:14.5px;font-weight:800;margin-top:2px}

/* alt menü */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(26,22,20,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--cizgi);
  padding:5px 2px calc(env(safe-area-inset-bottom) + 5px);
  display:flex;max-width:520px;margin:0 auto;
}
nav button{
  flex:1;background:none;border:none;color:var(--cokSoluk);
  font-size:8.5px;font-weight:800;padding:4px 1px;cursor:pointer;letter-spacing:.1px;
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
}
nav button .i{width:23px;height:23px;opacity:.55}
nav button.secili{color:var(--turuncu2)}
nav button.secili .i{opacity:1}
nav button .nokta{position:absolute;top:1px;right:calc(50% - 15px);width:7px;height:7px;border-radius:99px;background:var(--yesil);display:none;border:1.5px solid #1a1614}
nav button.uyari .nokta{display:block}

/* modal */
.perde{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:18px}
.perde.gizli{display:none}
.modal{background:var(--panel);border:1px solid var(--cizgi);border-radius:18px;padding:18px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.65)}
.modal h2{margin:0 0 5px;font-size:19px}
.modal p{margin:0 0 13px;font-size:12.5px;color:var(--soluk);line-height:1.55}
.modal .resim{height:110px;margin-bottom:6px}
.modal .resim svg{height:100%;width:auto;margin:0 auto}
.modal input{
  width:100%;padding:11px;border-radius:11px;border:1px solid var(--cizgi);
  background:var(--panel2);color:var(--yazi);font-size:15px;text-align:center;margin-bottom:9px;
  -webkit-user-select:text;user-select:text;
}
.modal input:focus{outline:none;border-color:var(--turuncu)}
.formaSecim{display:flex;gap:6px;justify-content:center;margin-bottom:11px;flex-wrap:wrap}
.formaSecim button{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer}
.formaSecim button.secili{border-color:#fff;transform:scale(1.12)}
.modalOzet{background:var(--panel2);border-radius:12px;padding:11px;margin-bottom:12px;font-size:12.5px;line-height:1.9;text-align:left}
.modalOzet span{float:right;font-weight:800}
.satirIki{display:flex;gap:7px}
.satirIki button{flex:1}
.ikinciBtn{background:var(--panel2)!important;color:var(--soluk)!important;border:1px solid var(--cizgi)!important}
</style>
</head>
<body>

<div id="uygulama">
  <header>
    <div class="oyuncuSatir">
      <div class="avatar" id="hAvatar"><div class="no" id="hNo">23</div></div>
      <div class="oyuncuBilgi">
        <div class="oyuncuAd" id="hAd">Oyuncu</div>
        <div class="ligAd" id="hLig">Sokak Sahası</div>
      </div>
      <div class="ovrKutu"><div class="s" data-t="u_genel">GENEL</div><div class="b" id="hOvr">5</div></div>
    </div>
    <div class="kaynaklar">
      <div class="kaynak k-para"><div class="ik" id="ikPara"></div><div class="sag"><div class="deg" id="hPara"></div><div class="hiz" id="hParaHiz"></div></div></div>
      <div class="kaynak k-ap"><div class="ik" id="ikAp"></div><div class="sag"><div class="deg" id="hAp">0</div><div class="hiz" id="hApHiz"></div></div></div>
      <div class="kaynak k-un"><div class="ik" id="ikUn"></div><div class="sag"><div class="deg" id="hUn">0</div><div class="hiz" data-t="u_maclardan">maçlardan</div></div></div>
    </div>
  </header>

  <main id="ekran"></main>

  <nav id="menu"></nav>
</div>

<div class="perde gizli" id="baslaPerde">
  <div class="modal">
    <div class="resim" id="baslaResim"></div>
    <h2 data-t="u_oyun">Hoop Legend</h2>
    <p data-t="u_basla_alt">Mahalle sahasından dünya yıldızlığına. Adını, numaranı ve forma rengini seç.</p>
    <input id="girAd" maxlength="14" data-tp="u_oyuncu_adin" placeholder="Oyuncu adın" autocomplete="off">
    <input id="girNo" maxlength="2" inputmode="numeric" data-tp="u_forma_no" placeholder="Forma no (0-99)" autocomplete="off">
    <div class="formaSecim" id="renkSecim"></div>
    <button class="buyukBtn" id="baslaBtn" data-t="u_kariyere_basla">KARİYERE BAŞLA</button>
  </div>
</div>

<div class="perde gizli" id="offPerde">
  <div class="modal">
    <div class="resim" id="offResim"></div>
    <h2 data-t="u_hosgeldin">Tekrar hoş geldin</h2>
    <p id="offSure"></p>
    <div class="modalOzet" id="offOzet"></div>
    <button class="reklamBtn" id="offReklam" style="display:none">
      <span class="oynat" id="offOynat"></span>
      <span class="met"><span class="b1" data-t="u_kazanci_2x">KAZANCI 2× YAP</span><div class="b2" id="offReklamAlt" data-t="u_kazanci_2x_alt">Kısa bir video izle, hepsi ikiye katlansın</div></span>
    </button>
    <button class="buyukBtn" id="offKapat" data-t="u_topla">TOPLA</button>
  </div>
</div>

<div class="perde gizli" id="emekliPerde">
  <div class="modal">
    <div class="resim" id="emekliResim"></div>
    <h2 data-t="u_formayi_as">Formayı as</h2>
    <p data-th="u_emekli_aciklama">…</p>
    <div class="modalOzet" id="emekliOzet"></div>
    <div class="satirIki">
      <button class="buyukBtn ikinciBtn" id="emekliVaz" data-t="u_vazgec">Vazgeç</button>
      <button class="buyukBtn mor" id="emekliOnay" data-t="u_emekli_ol_btn">EMEKLİ OL</button>
    </div>
  </div>
</div>

<script src="diller.js"></script>
<script src="sahne3d.js"></script>
<script>
"use strict";

/* ==================== DİL ==================== */
const DILLER = window.DILLER || { en:{} };
let dil = 'en';

function dilListesi(){ return Object.keys(DILLER); }
function dilBul(){
  let kayit = null;
  try{ kayit = localStorage.getItem('basketDil'); }catch(e){}
  if(kayit && DILLER[kayit]) return kayit;
  const liste = (typeof navigator !== 'undefined' && navigator.languages && navigator.languages.length)
    ? navigator.languages : [(typeof navigator !== 'undefined' && navigator.language) || 'en'];
  for(let i = 0; i < liste.length; i++){
    const tam = String(liste[i]).toLowerCase();
    if(DILLER[tam]) return tam;
    if(tam.indexOf('zh') === 0){
      const gel = (/hant|tw|hk|mo/.test(tam)) ? 'zh-hant' : 'zh';
      if(DILLER[gel]) return gel;
    }
    const kok = tam.split('-')[0];
    if(DILLER[kok]) return kok;
  }
  return 'en';
}
function dilSec(kod, kaydet){
  if(!DILLER[kod]) return false;
  dil = kod;

/* T('anahtar', deger0, deger1...) — eksik anahtar İngilizceye düşer */
function T(anahtar){
  const d = DILLER[dil] || {};
  let s = d[anahtar];
  if(s === undefined) s = (DILLER.en || {})[anahtar];
  if(s === undefined) return anahtar;
  for(let i = 1; i < arguments.length; i++) s = s.split('{' + (i-1) + '}').join(arguments[i]);
  return s;
}

/* ==================== YARDIMCI ==================== */
const BIRIM_EN = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function birimler(){ return (DILLER[dil] && DILLER[dil]._birim) || BIRIM_EN; }
function ondalik(){ return (DILLER[dil] && DILLER[dil]._ondalik) || '.'; }
function paraBirimi(){ return (DILLER[dil] && DILLER[dil]._pb) || '$'; }
function f(n){
  if(!isFinite(n)) return '∞';
  if(n < 0) return '-' + f(-n);
  const od = ondalik(), B = birimler();
  if(n < 1000){
    if(n < 10 && n % 1 !== 0) return (Math.round(n*10)/10).toString().replace('.', od);
    return Math.floor(n).toString();
  }
  let i = 0;
  while(n >= 1000 && i < B.length-1){ n /= 1000; i++; }
  if(n >= 1000) return n.toExponential(2).replace('.', od) + B[i];
  let s = n >= 100 ? n.toFixed(0) : n.toFixed(2);
  s = s.replace(/\.?0+$/,'');
  return s.replace('.', od) + B[i];
}
const p = n => paraBirimi() + f(n);
const yz = x => Math.round(x*100);
function sureMetni(sn){
  sn = Math.floor(sn);
  const s = Math.floor(sn/3600), d = Math.floor((sn%3600)/60), k = sn%60;
  if(s > 0) return T('u_saat', s, d);
  if(d > 0) return T('u_dakika', d, k);
  return T('u_saniye', k);
}

function geoTop(taban, r, sv, adet){ return taban * Math.pow(r,sv) * (Math.pow(r,adet)-1) / (r-1); }
function geoMaks(taban, r, sv, butce){
  const x = 1 + butce*(r-1)/(taban*Math.pow(r,sv));
  if(x <= 1) return 0;
  return Math.max(0, Math.floor(Math.log(x)/Math.log(r)));
}

    const x = 6 + (i * (w-12) / (adet-1));
    const r = renkler[i % renkler.length];
    const dy = (i % 3) * 1.6;
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+(y+dy).toFixed(1)+'" r="3.6" fill="'+r+'"/>';
  }
  return s;

/* ==================== REKLAM VE NATIVE AYARLARI ====================
   GERÇEK KİMLİKLER: AdMob hesabında uygulama + reklam birimi açtıktan sonra
   aşağıdaki kimlikleri değiştir ve REKLAM.test = false yap. Test kimlikleriyle
   Google'ın örnek reklamları gelir; gerçek kimliklerle test etmek hesabı kapattırır. */
const REKLAM = {
  test: false,
  gecisBekleme: 100,               // saniye — iki geçiş reklamı arası en az bu kadar
  ios: {
    uygulama: 'ca-app-pub-1898204997379799~2599240576',
    odullu:   'ca-app-pub-1898204997379799/8756474872',
    gecis:    'ca-app-pub-1898204997379799/7951639607',
  },
  android: {
    uygulama: 'ca-app-pub-1898204997379799~6760866923',
    odullu:   'ca-app-pub-1898204997379799/3246107834',
    gecis:    'ca-app-pub-1898204997379799/5680699486',
  },
};
const URUN_REKLAMSIZ = 'com.batuhanbulut.basketefsanesi.reklamsiz';
const BONUS_SURE = 4*3600*1000;    // ödüllü reklam bonusu: 4 saat
const TABLO = { guc:'genelguc', efsane:'efsanepuani', mac:'oynananmac' };
const BASARIM = [
  {k:'ilkterfi',  kimlik:'ilk_terfi',   ad:'İlk Terfi',        kosul:()=> D.lig >= 1},
  {k:'universite',kimlik:'universite',  ad:'Üniversiteli',     kosul:()=> D.lig >= 2},
  {k:'ikinci',    kimlik:'ikinci_lig',  ad:'Profesyonel',      kosul:()=> D.lig >= 4},
  {k:'super',     kimlik:'super_lig',   ad:'Süper Lig Yıldızı',kosul:()=> D.lig >= 5},
  {k:'avrupa',    kimlik:'avrupa',      ad:'Avrupa Fatihi',    kosul:()=> D.lig >= 6},
  {k:'zirve',     kimlik:'zirve',       ad:'Zirvedeki İsim',   kosul:()=> D.lig >= 9},
  {k:'emekli',    kimlik:'ilk_emekli',  ad:'Efsane Doğuyor',   kosul:()=> D.kariyerSayi >= 1},
  {k:'vitrin',    kimlik:'vitrin_tam',  ad:'Yaşam Tarzı',      kosul:()=> VITRIN.every(v => D.vitrin[v.k] === v.oge.length-1)},
  {k:'rozetci',   kimlik:'rozet_10',    ad:'Rozet Koleksiyoncusu', kosul:()=> ROZETLER.reduce((t,r)=> t + rz(r.k), 0) >= 10},
];

/* Native köprü: uygulama içindeyken AdMob/Game Center/StoreKit/haptik/bildirim.
   Tarayıcıda hepsi sessizce devre dışı — oyun aynı dosyayla web'de de çalışır. */
const YERLI = {
  var:false, platform:'web', gcGiris:false, gcOyuncu:'',
  sonGecis:0, magazaHazir:false, fiyat:'',
  admob:null, haptik:null, bildirim:null, yerli:null,

  kimlik(tur){
    const k = REKLAM[this.platform] || REKLAM.ios;
    return k[tur];
  },

  /* Oyun paketleyicisiz tek dosya olduğu için @capacitor/core JS'i yok:
     eklentilere native köprünün kendi `nativePromise` kanalından ulaşıyoruz.
     (Uygulama içindeki köprü `registerPlugin` sunmuyor — sadece toNative/nativePromise.) */
  eklentiAl(ad){
    const C = window.Capacitor;
    if(!C) return null;
    if(typeof C.registerPlugin === 'function') return C.registerPlugin(ad);
    if(C.Plugins && C.Plugins[ad]) return C.Plugins[ad];
    if(typeof C.nativePromise === 'function'){
      return new Proxy({}, {
        get: (_, metot) => (secenek) => C.nativePromise(ad, String(metot), secenek || {})
      });
    }
    return null;
  },

  async baslat(){
    const C = (typeof Capacitor !== 'undefined') ? Capacitor : null;
    if(!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return;
    this.var = true;
    this.platform = (typeof C.getPlatform === 'function') ? C.getPlatform() : 'ios';
    this.admob    = this.eklentiAl('AdMob');
    this.haptik   = this.eklentiAl('Haptics');
    this.bildirim = this.eklentiAl('LocalNotifications');
    this.yerli    = this.eklentiAl('BasketYerli');
    try{ await this.admob.initialize({ initializeForTesting: REKLAM.test, requestTrackingAuthorization: true }); }catch(e){}
    this.magazaDurum();
    this.gcGiris_();
    this.bildirimIzin();
  },

  titre(tur){
    if(!this.var || !this.haptik) return;
    try{
      if(tur === 'basari') this.haptik.notification({ type:'SUCCESS' });
      else if(tur === 'agir') this.haptik.impact({ style:'HEAVY' });
      else this.haptik.impact({ style:'LIGHT' });
    }catch(e){}
  },

  /* Ödüllü reklam: izlendiyse true döner. Reklamsız satın alınsa bile
     ödüllü reklam kalır (oyuncunun kendi isteğiyle izlediği ekstra). */
  async odullu(){
    if(!this.var) return false;
    try{
      await this.admob.prepareRewardVideoAd({ adId: this.kimlik('odullu'), isTesting: REKLAM.test });
      const odul = await this.admob.showRewardVideoAd();
      return !!odul;
    }catch(e){ return false; }
  },

  async gecis(){
    if(!this.var || D.reklamsiz) return;
    const simdi = Date.now()/1000;
    if(simdi - this.sonGecis < REKLAM.gecisBekleme) return;
    this.sonGecis = simdi;
    try{
      await this.admob.prepareInterstitial({ adId: this.kimlik('gecis'), isTesting: REKLAM.test });
      await this.admob.showInterstitial();
    }catch(e){}
  },

  /* --- Game Center --- */
  async gcGiris_(){
    try{
      const s = await this.yerli.girisYap();
      this.gcGiris = !!(s && s.giris);
      this.gcOyuncu = (s && s.oyuncu) || '';
      if(this.gcGiris){ this.skorlariGonder(); this.basarimlariBildir(); }
    }catch(e){}
  },
  skorlariGonder(){
    if(!this.var || !this.gcGiris) return;
    try{
      this.yerli.skorGonder({ tablo:TABLO.guc, deger: ovr() });
      this.yerli.skorGonder({ tablo:TABLO.efsane, deger: Math.floor(D.efsaneToplam) });
      this.yerli.skorGonder({ tablo:TABLO.mac, deger: Math.floor(D.macOynanan) });
    }catch(e){}
  },
  basarimlariBildir(){
    if(!this.var || !this.gcGiris) return;
    D.basarim = D.basarim || {};
    BASARIM.forEach(b=>{
      if(D.basarim[b.k] || !b.kosul()) return;
      D.basarim[b.k] = true;
      try{ this.yerli.basarim({ kimlik:b.kimlik, yuzde:100 }); }catch(e){}
    });
  },
  tabloGoster(tablo){
    if(!this.var) return;
    if(!this.gcGiris){ this.gcGiris_(); return; }
    try{ this.yerli.tabloGoster(tablo ? { tablo } : {}); }catch(e){}
  },

  /* --- Bildirim --- */
  async bildirimIzin(){
    try{ await this.bildirim.requestPermissions(); }catch(e){}
  },
  async bildirimKur(){
    if(!this.var) return;
    try{
      await this.bildirim.cancel({ notifications:[{ id:41 }] });
      const ms = offlineSaat()*3600*1000;
      await this.bildirim.schedule({ notifications:[{
        id: 41,
        title: T('u_bildirim_ad'),
        body: T('u_bildirim_metin'),
        schedule: { at: new Date(Date.now() + ms) },
      }]});
    }catch(e){}
  },

  /* --- Reklamsız satın alma --- */
  async magazaDurum(){
    if(!this.var) return;
    try{
      const s = await this.yerli.urunler({ kimlikler:[URUN_REKLAMSIZ] });
      const u = (s && s.urunler || [])[0];
      this.fiyat = u ? u.fiyat : '';
      this.magazaHazir = !!u;
      if(s && s.sahiplik && s.sahiplik[URUN_REKLAMSIZ]) D.reklamsiz = true;
    }catch(e){}
  },
  async satinAl(){
    if(!this.var) return false;
    try{
      const s = await this.yerli.satinAl({ kimlik: URUN_REKLAMSIZ });
      if(s && s.sahip){ D.reklamsiz = true; kayitYaz(); return true; }
    }catch(e){}
    return false;
  },
  async geriYukle(){
    if(!this.var) return false;
    try{
      const s = await this.yerli.geriYukle({ kimlikler:[URUN_REKLAMSIZ] });
      if(s && s.sahiplik && s.sahiplik[URUN_REKLAMSIZ]){ D.reklamsiz = true; kayitYaz(); return true; }
    }catch(e){}
    return false;
  },
};

/* ==================== DURUM ==================== */
const KAYIT = 'basketEfsanesi_v2';
function yeniDurum(){
  return {
    v:2, ad:'', no:23, renk:1, baslandi:false,
    para:25, ap:0, un:0,
    stat:{sut:0,uc:0,drip:0,pas:0,sav:0,atl:0},
    tesis:TESISLER.map(()=>0),
    sponsor:[],
    vitrin:{ayk:-1,araba:-1,ev:-1,taki:-1},
    lig:0,
    efsane:0, efsaneToplam:0, kariyerSayi:0,
    rozet:{},
    macSayac:9,
    kariyerUn:0, toplamPara:0, macOynanan:0, macGalibiyet:0,
    zaman:Date.now(),
    /* reklam/native tarafı — emeklilikte SIFIRLANMAZ, oyuncunun hakkı */
    reklamsiz:false,
    bonus:{ antrenman:0, para:0 },   // bitiş zaman damgaları (ms)
    basarim:{},
  };
}
/* Ödüllü reklam bonusu açık mı */
function bonusAktif(tur){ return (D.bonus && D.bonus[tur] || 0) > Date.now(); }
function bonusKalan(tur){ return Math.max(0, (D.bonus && D.bonus[tur] || 0) - Date.now()); }
function bonusVer(tur){
  const su = Math.max(Date.now(), D.bonus[tur] || 0);
  D.bonus[tur] = su + BONUS_SURE;
  kayitYaz();
}
let D = yeniDurum();
let carpan = 1, sekme = 'antrenman', sonKare = 0, logSatir = [], secilenRenk = 1;

function kayitYaz(){
  D.zaman = Date.now();
  try{ localStorage.setItem(KAYIT, JSON.stringify(D)); }catch(e){}
}
function kayitOku(){
  try{
    const h = localStorage.getItem(KAYIT);
    if(!h) return false;
    const o = JSON.parse(h);
    if(!o || o.v !== 2) return false;
    D = Object.assign(yeniDurum(), o);
    D.stat = Object.assign({sut:0,uc:0,drip:0,pas:0,sav:0,atl:0}, o.stat || {});
    D.tesis = TESISLER.map((_,i)=> (o.tesis && o.tesis[i]) || 0);
    D.vitrin = Object.assign({ayk:-1,araba:-1,ev:-1,taki:-1}, o.vitrin || {});
    D.rozet = o.rozet || {};
    D.sponsor = o.sponsor || [];
    D.bonus = Object.assign({antrenman:0, para:0}, o.bonus || {});
    D.basarim = o.basarim || {};
    return true;
  }catch(e){ return false; }
}
const rz = k => D.rozet[k] || 0;
function vitrinBonus(etki){
  let b = 0;
  VITRIN.forEach(v=>{
    if(v.etki !== etki) return;
    const sv = D.vitrin[v.k];
    if(sv >= 0) b += v.oge[sv].bonus;
  });
  return b;
}

/* ==================== HESAPLAR ==================== */
function statDeger(k){ return 5 + D.stat[k]; }
function ovr(){
  let t = 0;
  for(const s of STATLAR) t += statDeger(s.k);
  return Math.floor(t/STATLAR.length);
}
function efsaneCarpan(){ return 1 + 0.03*D.efsaneToplam; }
function apHiz(){
  let t = 0;
  D.tesis.forEach((adet,i)=>{ t += adet * TESISLER[i].ap; });
  return t * efsaneCarpan() * Math.pow(1.6, rz('antrenman')) * (1 + ovr()/150) * (1 + vitrinBonus('antrenman')) * (bonusAktif('antrenman') ? 2 : 1);
}
function sponsorBonus(){ let b = 0; D.sponsor.forEach(i => b += SPONSORLAR[i].bonus); return b; }
function paraCarpan(){
  return efsaneCarpan() * Math.pow(1.6, rz('reklam')) * (1 + sponsorBonus()) * (1 + vitrinBonus('para')) * (bonusAktif('para') ? 2 : 1);
}
function paraHiz(){
  let t = 0;
  D.sponsor.forEach(i => t += SPONSORLAR[i].gelir);
  return t * paraCarpan();
}
function unCarpan(){ return efsaneCarpan() * Math.pow(2, rz('yildiz')) * (1 + vitrinBonus('un')); }
function macCarpan(){ return 1 + vitrinBonus('mac'); }
function tapDeger(){ return (2 + ovr()*0.6 + apHiz()*0.12) * Math.pow(3, rz('el')); }
function macSuresi(){ return Math.max(3, 15 * Math.pow(0.93, rz('hizli'))); }
function kazanmaSansi(){
  const l = LIGLER[D.lig];
  return Math.min(0.95, Math.max(0.05, 0.5 + (ovr() - l.ovr - 6)*0.022 + rz('klutch')*0.04));
}
function macGeliri(){ return LIGLER[D.lig].pay * (1 + ovr()/35) * paraCarpan() * macCarpan(); }
function statMaliyet(s, sv){ return Math.ceil(s.taban * Math.pow(STAT_R, sv)); }
function tesisMaliyet(i, adet){ return Math.ceil(TESISLER[i].taban * Math.pow(TESIS_R, adet)); }
function rozetMaliyet(r){ return r.taban * Math.pow(2, rz(r.k)); }
function offlineSaat(){ return 4 + 4*rz('uyku'); }
function emekliKazanc(){ return Math.floor(Math.sqrt(D.kariyerUn/400)); }
function statAdet(s){
  if(carpan === 'maks') return Math.max(1, geoMaks(s.taban, STAT_R, D.stat[s.k], D.ap));
  return carpan;
}
function tesisAdet(i){
  if(carpan === 'maks') return Math.max(1, geoMaks(TESISLER[i].taban, TESIS_R, D.tesis[i], D.para));
  return carpan;
}
function formaRengi(){ return FORMA_RENK[Math.max(0, Math.min(FORMA_RENK.length-1, D.baslandi ? D.lig : secilenRenk))]; }
function karakterAyar(ek){
  const o = {
    forma: D.baslandi ? FORMA_RENK[D.lig] : FORMA_RENK[secilenRenk],
    ayk: AYK_RENK[Math.max(0, D.vitrin.ayk)],
    no: D.no,
    zincir: D.vitrin.taki >= 2,
    gozluk: D.efsaneToplam > 0,
    bant: ovr() >= 60,
  };
  return Object.assign(o, ek || {});
}

/* ==================== EYLEMLER ==================== */
function statAl(s){
  const n = statAdet(s), m = Math.ceil(geoTop(s.taban, STAT_R, D.stat[s.k], n));
  if(D.ap < m) return;
  D.ap -= m; D.stat[s.k] += n;
  UC.tazele();          // görünüm değiştiyse 3B karaktere yansısın
  /* sekmeCiz() ÇAĞIRMIYORUZ: tüm sekmeyi yeniden çizmek sayfayı başa atıyordu.
     Satır güncelleyicileri seviye/maliyet/GENEL değerlerini zaten tazeliyor. */
}
function tesisAl(i){
  const n = tesisAdet(i), m = Math.ceil(geoTop(TESISLER[i].taban, TESIS_R, D.tesis[i], n));
  if(D.para < m) return;
  D.para -= m; D.tesis[i] += n;
}
function sponsorAl(i){
  if(D.sponsor.includes(i) || D.un < SPONSORLAR[i].un) return;
  D.un -= SPONSORLAR[i].un;
  D.sponsor.push(i);
  logEkle(T('u_sozlesme_log', '<b>' + sponsorAd(i) + '</b>'));
}
function vitrinAl(vi, oi){
  const v = VITRIN[vi];
  if(oi !== D.vitrin[v.k] + 1) return;
  const fi = v.oge[oi].fiyat;
  if(D.para < fi) return;
  D.para -= fi; D.vitrin[v.k] = oi;
  UC.tazele();
  YERLI.titre('basari');
  YERLI.basarimlariBildir();
  logEkle('<span class="p">' + T('u_satin_log', '<b>' + ogeAd(v.k, oi) + '</b>') + '</span>');
  sekmeCiz();
}
function terfiEt(){
  if(D.lig >= LIGLER.length-1 || ovr() < LIGLER[D.lig+1].ovr) return;
  D.lig++;
  logEkle('<span class="p">' + T('u_terfi_log', '<b>' + ligAd(D.lig) + '</b>') + '</span>');
  YERLI.titre('basari');
  YERLI.basarimlariBildir();
  YERLI.skorlariGonder();
  YERLI.gecis();
  UC.lig();
  sekmeCiz();
}
function rozetAl(r){
  const m = rozetMaliyet(r);
  if(D.efsane < m || rz(r.k) >= r.maks) return;
  D.efsane -= m; D.rozet[r.k] = rz(r.k) + 1;
}
function antrenmanYap(){
  const d = tapDeger();
  D.ap += d;
  YERLI.titre('hafif');
  UC.sut();
  sahneEfekt('+' + f(d));
}
function emekliOl(){
  const kazanc = emekliKazanc();
  D.efsane += kazanc; D.efsaneToplam += kazanc; D.kariyerSayi++;
  const ad = D.ad, no = D.no, renk = D.renk, ef = D.efsane, eft = D.efsaneToplam, ks = D.kariyerSayi, roz = D.rozet;
  const reklamsiz = D.reklamsiz, bonus = D.bonus, basarimlar = D.basarim;
  D = Object.assign(yeniDurum(), {ad, no, renk, baslandi:true, efsane:ef, efsaneToplam:eft, kariyerSayi:ks, rozet:roz,
    reklamsiz, bonus, basarim:basarimlar});
  const hediye = 6 * rz('yetenek');
  if(hediye > 0) for(const s of STATLAR) D.stat[s.k] = hediye;
  logSatir = [];
  logEkle('<span class="p">' + T('u_kariyer_log', ks, kazanc) + '</span>');
  $('emekliPerde').classList.add('gizli');
  YERLI.titre('basari');
  YERLI.basarimlariBildir();
  YERLI.skorlariGonder();
  YERLI.gecis();
  sekmeGec('antrenman');
  kayitYaz();
}
function logEkle(html){
  logSatir.unshift(html);
  if(logSatir.length > 9) logSatir.pop();
  const el = $('macLog');
  if(el) el.innerHTML = logSatir.join('<br>');
}

/* ==================== MAÇ ==================== */
function macOyna(){
  const l = LIGLER[D.lig];
  const kazandi = Math.random() < kazanmaSansi();
  const dalga = 0.85 + Math.random()*0.3;
  const kazanc = macGeliri() * (kazandi ? 1.7 : 0.55) * dalga;
  const unKazanc = l.un * (kazandi ? 1 : 0.3) * dalga * unCarpan();
  D.para += kazanc; D.toplamPara += kazanc;
  D.un += unKazanc; D.kariyerUn += unKazanc;
  D.macOynanan++;
  if(kazandi) D.macGalibiyet++;
  const benim = Math.floor(70 + ovr()*0.35 + Math.random()*22 + (kazandi ? 9 : 0));
  const onlar = kazandi ? benim - (2 + Math.floor(Math.random()*16)) : benim + (2 + Math.floor(Math.random()*16));
  const sayi = Math.floor(10 + ovr()*0.28 + Math.random()*14);
  logEkle((kazandi ? '<span class="g">✅ ' + T('u_galibiyet') + '</span>' : '<span class="m">❌ ' + T('u_maglubiyet') + '</span>') +
    ' <b>' + benim + '-' + onlar + '</b> · ' + ligRakip(D.lig) + ' · <b>' + sayi + '</b> ' + T('u_sayi') + ' · +' + p(kazanc) + ' · +' + f(unKazanc) + '⭐');
}

/* ==================== DÖNGÜ ==================== */
function tik(dt){
  D.ap += apHiz()*dt;
  const kaz = paraHiz()*dt;
  D.para += kaz; D.toplamPara += kaz;
  D.macSayac += dt;
  const sure = macSuresi();
  let koruma = 0;
  while(D.macSayac >= sure && koruma < 40){ D.macSayac -= sure; macOyna(); koruma++; }
}
function offlineHesapla(){
  const gecen = Math.min((Date.now() - D.zaman)/1000, offlineSaat()*3600);
  if(gecen < 60) return;
  const ap = apHiz()*gecen, parPasif = paraHiz()*gecen;
  const l = LIGLER[D.lig];
  const macAdet = Math.floor(gecen/macSuresi());
  const sans = kazanmaSansi();
  const macPara = macGeliri()*(sans*1.7 + (1-sans)*0.55)*0.6*macAdet;
  const macUn = l.un*(sans + (1-sans)*0.3)*unCarpan()*macAdet*0.6;
  D.ap += ap;
  D.para += parPasif + macPara; D.toplamPara += parPasif + macPara;
  D.un += macUn; D.kariyerUn += macUn;
  D.macOynanan += macAdet;
  D.macGalibiyet += Math.round(macAdet*sans);
  $('offSure').textContent = T('u_off_sure', sureMetni(gecen));
  sonOffline = { ap:ap, para:parPasif+macPara, un:macUn, mac:macAdet, ikilendi:false };
  offOzetYaz();
  const rb = $('offReklam');
  if(rb){
    rb.style.display = YERLI.var ? 'flex' : 'none';
    rb.disabled = false;
    $('offOynat').innerHTML = ikon('oynat');
    $('offReklamAlt').textContent = T('u_kazanci_2x_alt');
  }
  $('offPerde').classList.remove('gizli');
}

let sonOffline = null;
function offOzetYaz(){
  if(!sonOffline) return;
  $('offOzet').innerHTML =
    '⚡ ' + T('u_antrenman') + ' <span>+' + f(sonOffline.ap) + '</span><br>' +
    '💵 ' + T('u_para') + ' <span>+' + p(sonOffline.para) + '</span><br>' +
    '⭐ ' + T('u_un') + ' <span>+' + f(sonOffline.un) + '</span><br>' +
    '🏀 ' + T('u_off_mac') + ' <span>' + f(sonOffline.mac) + '</span>' +
    (sonOffline.ikilendi ? '<br><b style="color:var(--yesil)">' + T('u_2x_uygulandi') + '</b>' : '');
}

/* ==================== 3B SAHNE KÖPRÜSÜ ==================== */
const UC = {
  get acik(){ return typeof Sahne3D !== 'undefined' && Sahne3D.destekli(); },
  imza:'',
  ayarNesnesi(){
    const o = karakterAyar();
    return { forma:o.forma, ayk:o.ayk, zincir:o.zincir, gozluk:o.gozluk, no:D.no, lig:D.lig };
  },
  bagla(kap){
    if(!this.acik) return false;
    /* karakter zaten doğru değerlerle kuruluyor; imzayı sıfırlamıyoruz ki
       her sekme çiziminde forma dokusu boş yere yeniden üretilmesin */
    const a = this.ayarNesnesi();
    Sahne3D.baslat(kap, a);
    Sahne3D.ligAyarla(D.lig);
    if(!this.imza) this.imza = a.forma + '|' + a.ayk + '|' + a.no + '|' + a.zincir + '|' + a.gozluk;
    this.tazele();
    return true;
  },
  /* karakter görünümü sadece gerçekten değiştiyse yeniden üretilir (doku maliyeti) */
  tazele(){
    if(!this.acik) return;
    const a = this.ayarNesnesi();
    const imza = a.forma + '|' + a.ayk + '|' + a.no + '|' + a.zincir + '|' + a.gozluk;
    if(imza === this.imza) return;
    this.imza = imza;
    Sahne3D.karakterAyarla(a);
  },
  lig(){ if(this.acik) Sahne3D.ligAyarla(D.lig); },
  sut(){ if(this.acik) Sahne3D.sut(); },
  duraklat(){ if(this.acik) Sahne3D.duraklat(); },
  devam(){ if(this.acik) Sahne3D.devam(); },
};

/* ==================== SAHNE EFEKTİ ==================== */
function sahneEfekt(metin){
  const sahne = $('sahne');
  if(!sahne) return;

    const y = document.createElement('div');
    y.className = 'ucanYazi'; y.textContent = metin;
    sahne.appendChild(y);
    setTimeout(()=> y.remove(), 1000);
    return;
  }
  const oyuncu = sahne.querySelector('.oyuncu');
  if(oyuncu){ oyuncu.classList.remove('zipla'); void oyuncu.offsetWidth; oyuncu.classList.add('zipla'); }
  const top = document.createElement('div');
  top.className = 'ucanTop';
  top.innerHTML = svg('-13 -13 26 26', topCiz(0,0,12));
  sahne.appendChild(top);
  const y = document.createElement('div');
  y.className = 'ucanYazi'; y.textContent = metin;
  sahne.appendChild(y);
  setTimeout(()=>{ top.remove(); y.remove(); }, 1000);
}

function ustCiz(){
  $('hAd').textContent = D.ad || T('u_oyuncu');
  $('hNo').textContent = D.no;
  let ligMetin = ligAd(D.lig) + (D.kariyerSayi ? ' · ' + T('u_kariyer', D.kariyerSayi+1) : '');
  if(bonusAktif('antrenman')) ligMetin += '<span class="bonusRoz">2× ⚡ ' + sureKisa(bonusKalan('antrenman')) + '</span>';
  if(bonusAktif('para')) ligMetin += '<span class="bonusRoz para">2× ₺ ' + sureKisa(bonusKalan('para')) + '</span>';
  $('hLig').innerHTML = ligMetin;
  $('hOvr').textContent = ovr();
  $('hPara').textContent = p(D.para);
  $('hParaHiz').textContent = '+' + p(paraHiz()) + '/' + T('u_sn');
  $('hAp').textContent = f(D.ap);
  $('hApHiz').textContent = '+' + f(apHiz()) + '/' + T('u_sn');
  $('hUn').textContent = f(D.un);
  document.querySelectorAll('#menu button').forEach(b=>{
    const s = b.dataset.sekme;
    let u = false;
    if(s === 'antrenman') u = STATLAR.some(st => D.ap >= statMaliyet(st, D.stat[st.k]));
    else if(s === 'tesis') u = TESISLER.some((t,i)=> (i === 0 || D.tesis[i-1] > 0) && D.para >= tesisMaliyet(i, D.tesis[i]));
    else if(s === 'mac') u = D.lig < LIGLER.length-1 && ovr() >= LIGLER[D.lig+1].ovr;
    else if(s === 'yasam') u = VITRIN.some(v => D.vitrin[v.k] + 1 < v.oge.length && D.para >= v.oge[D.vitrin[v.k]+1].fiyat);
    else if(s === 'sponsor') u = SPONSORLAR.some((sp,i)=> !D.sponsor.includes(i) && D.un >= sp.un);
    else u = ROZETLER.some(r => rz(r.k) < r.maks && D.efsane >= rozetMaliyet(r));
    b.classList.toggle('uyari', u);
  });
}

  guncelleyiciler.push(()=>{
    ozet.innerHTML = '<div class="izgara">' +
      '<div class="hucre"><div class="e">' + T('u_antrenman_bonusu') + '</div><div class="d" style="color:var(--mavi)">+' + yz(vitrinBonus('antrenman')) + '%</div></div>' +
      '<div class="hucre"><div class="e">' + T('u_para_bonusu') + '</div><div class="d" style="color:var(--yesil)">+' + yz(vitrinBonus('para')) + '%</div></div>' +
      '<div class="hucre"><div class="e">' + T('u_un_bonusu') + '</div><div class="d" style="color:var(--mor)">+' + yz(vitrinBonus('un')) + '%</div></div>' +
      '<div class="hucre"><div class="e">' + T('u_mac_primi') + '</div><div class="d" style="color:var(--altin)">+' + yz(vitrinBonus('mac')) + '%</div></div></div>';
  });

  
  VITRIN.forEach((v,vi)=>{
    ekran.appendChild(baslikYap(vitrinAd(v.k)));
    const izgara = document.createElement('div');
    izgara.className = 'vitrin';
    ekran.appendChild(izgara);
    v.oge.forEach((o,oi)=>{
      const kart = document.createElement('div');
      kart.className = 'vKart';
      kart.innerHTML = '<div class="vGorsel">' + svg('0 0 120 90', v.ciz(oi), 'preserveAspectRatio="xMidYMid meet"') +
        '<div class="etiket" data-et style="display:none">' + T('u_sahip') + '</div></div>' +
        '<div class="vGovde"><div class="vAd">' + ogeAd(v.k, oi) + '</div>' +
        '<div class="vEtki">+' + yz(o.bonus) + '% ' + T('e_' + v.etki) + '</div>' +
        '<button class="vBtn"></button></div>';
      izgara.appendChild(kart);
      const b = kart.querySelector('.vBtn'), et = kart.querySelector('[data-et]');
      b.onclick = ()=> vitrinAl(vi, oi);
      guncelleyiciler.push(()=>{
        const sahip = D.vitrin[v.k] >= oi, sira = D.vitrin[v.k] + 1 === oi;
        kart.classList.toggle('sahip', sahip);
        kart.classList.toggle('kilit', !sahip && !sira);
        et.style.display = sahip ? 'block' : 'none';
        if(sahip){ b.textContent = D.vitrin[v.k] === oi ? T('u_kullaniyorsun') : T('u_eski_model'); b.disabled = true; b.className = 'vBtn'; }
        else if(!sira){ b.textContent = T('u_once_onceki'); b.disabled = true; b.className = 'vBtn'; }
        else{ b.textContent = p(o.fiyat); b.disabled = D.para < o.fiyat; b.className = 'vBtn ' + (D.para >= o.fiyat ? 'aktif' : ''); }
      });
    });
  });

  const ip = document.createElement('div');
  ip.className = 'kart';
  ip.innerHTML = '<div class="ipucu">' + T('u_ipucu_vitrin') + '</div>';
  ekran.appendChild(ip);
}

/* ---- SPONSOR ---- */
function cizSponsor(ekran){
  ekran.appendChild(baslikYap(T('u_sponsorlar')));
  const ozet = document.createElement('div');
  ozet.className = 'kart';
  ekran.appendChild(ozet);
  guncelleyiciler.push(()=>{
    ozet.innerHTML = '<div class="izgara">' +
      '<div class="hucre"><div class="e">' + T('u_sponsor_geliri') + '</div><div class="d" style="color:var(--yesil)">' + p(paraHiz()) + '/' + T('u_sn') + '</div></div>' +
      '<div class="hucre"><div class="e">' + T('u_para_bonusu') + '</div><div class="d">+' + yz(sponsorBonus()) + '%</div></div></div>';
  });
  SPONSORLAR.forEach((s,i)=>{
    const el = satirYap(ikon(s.ik), sponsorAd(i), '');
    ekran.appendChild(el);
    const b = el.querySelector('.alBtn'), alt = el.querySelector('.satirAlt');
    b.onclick = ()=> sponsorAl(i);
    guncelleyiciler.push(()=>{
      const sahip = D.sponsor.includes(i);
      alt.textContent = p(s.gelir) + '/' + T('u_sn') + ' · ' + T('u_tum_para', yz(s.bonus));
      if(sahip){ b.innerHTML = T('u_imzali'); b.disabled = true; b.className = 'alBtn aktif'; el.classList.remove('kilit'); }
      else{
        b.innerHTML = T('u_imzala') + '<small>' + f(s.un) + ' ⭐</small>';
        b.disabled = D.un < s.un;
        b.className = 'alBtn ' + (D.un >= s.un ? 'aktifMor' : '');
        el.classList.toggle('kilit', D.un < s.un/6);
      }
    });
  });
}

/* ---- EFSANE ---- */
function cizEfsane(ekran){
  const kart = document.createElement('div');
  kart.className = 'terfiKart';
  ekran.appendChild(kart);

  ekran.appendChild(baslikYap(T('u_rozetler')));
  ROZETLER.forEach(r=>{
    const el = satirYap(ikon(r.ik), rozetAd(r.k) + ' <span class="rozetSayi" data-sv></span>', rozetNot(r.k));
    ekran.appendChild(el);
    const b = el.querySelector('.alBtn'), sv = el.querySelector('[data-sv]');
    b.onclick = ()=> rozetAl(r);
    guncelleyiciler.push(()=>{
      const s = rz(r.k), m = rozetMaliyet(r);
      sv.textContent = s + (r.maks < 90 ? '/' + r.maks : '');
      if(s >= r.maks){ b.innerHTML = T('u_maks'); b.disabled = true; b.className = 'alBtn'; }
      else{
        b.innerHTML = T('u_al') + '<small>' + f(m) + ' 👑</small>';
        b.disabled = D.efsane < m;
        b.className = 'alBtn ' + (D.efsane >= m ? 'aktifMor' : '');
      }
    });
  });

  if(YERLI.var){
    ekran.appendChild(baslikYap(T('u_game_center')));
    const gc = document.createElement('div');
    gc.className = 'kart';
    ekran.appendChild(gc);
    guncelleyiciler.push(()=>{
      gc.innerHTML =
        '<div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;flex:0 0 auto">' + ikon('kupa') + '</div>' +
        '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:800">' +
        (YERLI.gcGiris ? (YERLI.gcOyuncu || T('u_bagli')) : T('u_bagli_degil')) + '</div>' +
        '<div style="font-size:10.5px;color:var(--soluk)">' + T('u_gc_alt') + '</div></div></div>' +
        '<div class="satirIki" style="margin-top:9px">' +
        '<button class="buyukBtn" id="gcTablo" style="margin-top:0">' + T('u_liderlik') + '</button>' +
        '<button class="buyukBtn ikinciBtn" id="gcBasarim" style="margin-top:0">' + T('u_basarimlar') + '</button></div>';
      const t = $('gcTablo'), b = $('gcBasarim');
      if(t) t.onclick = ()=> YERLI.tabloGoster(TABLO.guc);
      if(b) b.onclick = ()=> YERLI.tabloGoster(null);
    });

    /* Satın alma ürünü App Store Connect'te tanımlı değilken bu bölüm hiç
       görünmez — incelemede çalışmayan bir düğme kalmasın diye. Ürün açılınca
       ya da oyuncu zaten satın almışsa kendiliğinden geri gelir. */
    const reklamBaslik = baslikYap(T('u_reklamlar'));
    ekran.appendChild(reklamBaslik);
    const mg = document.createElement('div');
    mg.className = 'kart';
    ekran.appendChild(mg);
    guncelleyiciler.push(()=>{
      const gorunur = D.reklamsiz || YERLI.magazaHazir;
      reklamBaslik.style.display = gorunur ? '' : 'none';
      mg.style.display = gorunur ? '' : 'none';
      if(!gorunur) return;
      mg.innerHTML =
        '<div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;flex:0 0 auto">' + ikon('reklamsiz') + '</div>' +
        '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:800">' +
        (D.reklamsiz ? T('u_reklamsiz_var') : T('u_reklamsiz')) + '</div>' +
        '<div style="font-size:10.5px;color:var(--soluk)">' +
        (D.reklamsiz ? T('u_reklamsiz_var_a') : T('u_reklamsiz_yok_a')) +
        '</div></div></div>' +
        (D.reklamsiz ? '' :
          '<button class="buyukBtn mor" id="satinBtn">' +
          (YERLI.magazaHazir ? (T('u_reklamlari_kaldir') + (YERLI.fiyat ? ' · ' + YERLI.fiyat : '')) : T('u_magaza_hazirlaniyor')) +
          '</button>') +
        '<div class="ipucu" style="margin-top:8px;text-align:center"><b id="geriBtn" style="color:var(--mavi);cursor:pointer">' + T('u_geri_yukle') + '</b></div>';
      const sb = $('satinBtn'), gb = $('geriBtn');
      if(sb) sb.onclick = async ()=>{
        sb.disabled = true; sb.textContent = T('u_isleniyor');
        const oldu = await YERLI.satinAl();
        if(oldu) YERLI.titre('basari');
        sekmeCiz();
      };
      if(gb) gb.onclick = async ()=>{ await YERLI.geriYukle(); sekmeCiz(); };
    });
  }
  ekran.appendChild(baslikYap(T('u_kariyer_ozeti')));
  const ist = document.createElement('div');
  ist.className = 'kart';
  ekran.appendChild(ist);

  ekran.appendChild(baslikYap(T('u_dil')));
  const dilKart = document.createElement('div');
  dilKart.className = 'kart';
  dilKart.innerHTML = '<div class="dilIzgara">' + dilListesi().map(function(k){
      return '<button class="dilBtn' + (k === dil ? ' secili' : '') + '" data-dil="' + k + '">' +
             ((DILLER[k] && DILLER[k]._ad) || k) + '</button>';
    }).join('') + '</div>';
  ekran.appendChild(dilKart);
  dilKart.querySelectorAll('[data-dil]').forEach(function(b){
    b.onclick = function(){ dilDegistir(b.getAttribute('data-dil')); };
  });

  const yasal = document.createElement('div');
  yasal.className = 'kart';
  yasal.innerHTML = '<div class="ipucu" style="text-align:center">' +
    '<a href="https://cactuscafes.com/hooplegend/gizlilik/" target="_blank" rel="noopener" ' +
    'style="color:var(--mavi);text-decoration:none">' + T('u_gizlilik') + '</a></div>';
  ekran.appendChild(yasal);

  const sif = document.createElement('div');
  sif.className = 'kart';
  sif.innerHTML = '<div class="ipucu">' + T('u_kayit_sil') + '</div>';
  ekran.appendChild(sif);
  sif.querySelector('#sifirlaBtn').onclick = ()=>{
    if(confirm(T('u_kayit_sil_onay'))){ localStorage.removeItem(KAYIT); location.reload(); }
  };

  guncelleyiciler.push(()=>{
    const kazanc = emekliKazanc(), uygun = D.lig >= 4;
    kart.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px"><div style="width:38px;height:38px;flex:0 0 auto">' + ikon('efsane') + '</div>' +
      '<div><div style="font-size:14px;font-weight:800">' + T('u_efsane_puani') + ': ' + f(D.efsane) + '</div>' +
      '<div style="font-size:11px;color:var(--soluk)">' + T('u_toplam') + ' ' + f(D.efsaneToplam) + ' · ' + T('u_tum_kazanclara', D.efsaneToplam*3) + '</div></div></div>' +
      '<div class="ipucu" style="margin-top:7px">' +
      (uygun ? T('u_emekli_bilgi', kazanc) : T('u_emekli_kilit', ligAd(4))) + '</div>' +
      '<button class="buyukBtn mor" id="emekliBtn" ' + (uygun && kazanc > 0 ? '' : 'disabled') + '>' +
      (uygun ? (kazanc > 0 ? T('u_emekli_ol', kazanc) : T('u_daha_fazla_un')) : T('u_emeklilik_kilitli')) + '</button>';
    const eb = $('emekliBtn');
    if(eb) eb.onclick = ()=>{
      $('emekliResim').innerHTML = karakter(karakterAyar({gozluk:true, top:false}));
      $('emekliOzet').innerHTML =
        '👑 ' + T('u_kazanacagin') + ' <span style="color:var(--altin)">+' + emekliKazanc() + '</span><br>' +
        '📈 ' + T('u_yeni_bonus') + ' <span>+' + ((D.efsaneToplam + emekliKazanc())*3) + '%</span><br>' +
        '🧬 ' + T('u_baslangic_ist') + ' <span>' + (5 + 6*rz('yetenek')) + '</span>';
      $('emekliPerde').classList.remove('gizli');
    };
    ist.innerHTML = '<div class="izgara">' +
      '<div class="hucre"><div class="e">' + T('u_kariyer_sayisi') + '</div><div class="d">' + (D.kariyerSayi+1) + '</div></div>' +
      '<div class="hucre"><div class="e">' + T('u_bu_kariyerde_un') + '</div><div class="d" style="color:var(--mor)">' + f(D.kariyerUn) + '⭐</div></div>' +
      '<div class="hucre"><div class="e">' + T('u_toplam_kazanc') + '</div><div class="d" style="color:var(--yesil)">' + p(D.toplamPara) + '</div></div>' +
      '<div class="hucre"><div class="e">' + T('u_genel_guc') + '</div><div class="d" style="color:var(--altin)">' + ovr() + '</div></div></div>';
  });
}

/* ---- SEKME ---- */
function sekmeCiz(){
  if(sekme !== 'antrenman') UC.duraklat();
  /* yeniden çizim sayfayı başa atmasın (vitrin alımı, terfi, çarpan değişimi) */
  const kaydirma = window.scrollY || 0;
  const ekran = $('ekran');
  ekran.innerHTML = '';
  guncelleyiciler = [];
  if(sekme === 'antrenman') cizAntrenman(ekran);
  else if(sekme === 'tesis') cizTesis(ekran);
  else if(sekme === 'mac') cizMac(ekran);
  else if(sekme === 'yasam') cizYasam(ekran);
  else if(sekme === 'sponsor') cizSponsor(ekran);
  else cizEfsane(ekran);
  guncelleyiciler.forEach(g=>g());
  if(kaydirma) window.scrollTo(0, kaydirma);
}
function sekmeGec(s){
  sekme = s;
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('secili', b.dataset.sekme === s));
  window.scrollTo(0,0);
  sekmeCiz();
}

/* ==================== BAŞLAT ==================== */
let sonCizim = 0;
function anaDongu(t){
  const dt = Math.min((t - sonKare)/1000, 0.5);
  sonKare = t;
  if(D.baslandi){
    tik(dt);
    if(t - sonCizim > 90){
      sonCizim = t;
      ustCiz(); avatarCiz();
      guncelleyiciler.forEach(g=>g());
    }
  }
  requestAnimationFrame(anaDongu);
}
function baslangicEkrani(){
  $('renkSecim').innerHTML = FORMA_RENK.map((r,i)=>
    '<button data-renk="' + i + '" class="' + (i === secilenRenk ? 'secili' : '') + '" style="background:' + r + '"></button>').join('');
  $('renkSecim').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ secilenRenk = parseInt(b.dataset.renk,10); baslangicEkrani(); };
  });
  $('baslaResim').innerHTML = karakter({forma:FORMA_RENK[secilenRenk], no:($('girNo') && parseInt($('girNo').value,10)) || 23, ayk:AYK_RENK[0]});
  $('baslaPerde').classList.remove('gizli');
}
function oyunuBaslat(){
  dilSec(dilBul(), false);
  metinleriYaz();
  YERLI.baslat();          // ilk await'e kadar senkron: YERLI.var burada belli olur
  menuCiz();
  $('ikPara').innerHTML = ikon('para');
  $('ikAp').innerHTML = ikon('ap');
  $('ikUn').innerHTML = ikon('un');
  $('offResim').innerHTML = karakter({forma:'#0ea5e9', no:23, ayk:'#111827', top:false});
  const vardi = kayitOku();
  if(vardi && D.baslandi){
    sekmeCiz(); ustCiz(); avatarCiz();
    offlineHesapla();
  }else{
    baslangicEkrani();
  }
  requestAnimationFrame(anaDongu);
  setInterval(kayitYaz, 5000);
  window.addEventListener('pagehide', kayitYaz);
  window.addEventListener('blur', kayitYaz);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ kayitYaz(); YERLI.bildirimKur(); UC.duraklat(); }
    else if(sekme === 'antrenman') UC.devam();
    if(!document.hidden){ YERLI.skorlariGonder(); YERLI.basarimlariBildir(); }
  });
}

$('baslaBtn').onclick = ()=>{
  const ad = ($('girAd').value || '').trim() || 'Efsane';
  let no = parseInt($('girNo').value, 10);
  if(!isFinite(no) || no < 0 || no > 99) no = 23;
  D = yeniDurum();
  D.ad = ad; D.no = no; D.renk = secilenRenk; D.baslandi = true;
  $('baslaPerde').classList.add('gizli');
  sekmeGec('antrenman');
  kayitYaz();
};
$('emekliOnay').onclick = emekliOl;
$('emekliVaz').onclick = ()=> $('emekliPerde').classList.add('gizli');
$('offKapat').onclick = ()=> $('offPerde').classList.add('gizli');
$('offReklam').onclick = async ()=>{
  const rb = $('offReklam');
  if(!sonOffline || sonOffline.ikilendi) return;
  rb.disabled = true;
  $('offReklamAlt').textContent = T('u_reklam_yukleniyor');
  const izlendi = await YERLI.odullu();
  if(izlendi){
    D.ap += sonOffline.ap;
    D.para += sonOffline.para; D.toplamPara += sonOffline.para;
    D.un += sonOffline.un; D.kariyerUn += sonOffline.un;
    sonOffline.ap *= 2; sonOffline.para *= 2; sonOffline.un *= 2;
    sonOffline.ikilendi = true;
    YERLI.titre('basari');
    offOzetYaz();
    rb.style.display = 'none';
    kayitYaz();
  }else{
    rb.disabled = false;
    $('offReklamAlt').textContent = T('u_kazanci_2x_alt');
  }
};

oyunuBaslat();

/* çevrimdışı oynanabilsin diye service worker (yalnız http/https'te) */
if(typeof navigator !== 'undefined' && navigator.serviceWorker && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
