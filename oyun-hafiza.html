<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Cactus Hafıza — Cactus Coffee</title>
<meta name="theme-color" content="#F0C78C">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  min-height:100%;
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,#FCEFD3 0%,#F7DDB0 55%,#F0C78C 100%);
  background-attachment:fixed;
  color:#14271D;
  user-select:none;-webkit-user-select:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
}
.sayfa{max-width:440px;margin:0 auto;}

/* ── Üst bar ── */
.ustbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.yuvarlak-btn{
  width:38px;height:38px;border-radius:50%;border:2.5px solid #1A3310;
  background:rgba(247,239,222,.92);color:#1A3310;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.baslik{text-align:center;}
.baslik h1{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:2px;color:#1A3310;text-transform:uppercase;}
.baslik .alt{font-size:11px;color:#8a6a2a;letter-spacing:1px;margin-top:2px;}

/* ── HUD ── */
.hud{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.hud .kutu{
  background:rgba(247,239,222,.85);border:1.5px solid #C8A86A;border-radius:12px;
  padding:7px 14px;text-align:center;min-width:86px;
}
.hud .etiket{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8a6a2a;font-weight:600;}
.hud .deger{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:#1A3310;margin-top:1px;}

/* ── Kart ızgarası ── */
.izgara{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;perspective:900px;}
.kart{position:relative;aspect-ratio:3/4;cursor:pointer;border:none;background:none;padding:0;font-family:inherit;}
.kart-ic{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .38s cubic-bezier(.4,.1,.25,1.2);
}
.kart.acik .kart-ic,.kart.esti .kart-ic{transform:rotateY(180deg);}
.yuz{
  position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.yuz.arka{
  background:linear-gradient(150deg,#3F7A34,#2D5A27);
  border:2.5px solid #1A3310;
  box-shadow:0 3px 10px rgba(26,51,16,.25),inset 0 1px 0 rgba(255,255,255,.15);
}
.yuz.arka .cic{width:34px;height:34px;color:#F7EFDE;opacity:.9;}
.yuz.arka .marka{font-size:7px;letter-spacing:2.5px;color:rgba(247,239,222,.55);font-weight:600;}
.yuz.on{
  background:#F7EFDE;border:2.5px solid #C8A86A;transform:rotateY(180deg);
  box-shadow:0 3px 10px rgba(26,51,16,.18);
  padding:6px 4px;
}
.yuz.on .cic{width:38px;height:38px;color:#1A3310;}
.yuz.on .ad{font-size:10px;font-weight:600;color:#5a5348;text-align:center;line-height:1.25;}
.kart.esti .yuz.on{border-color:#3F7A34;box-shadow:0 0 0 2px rgba(63,122,52,.35),0 3px 10px rgba(26,51,16,.18);}
.kart.esti{cursor:default;}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.kart.yanlis{animation:salla .3s ease;}
@keyframes zipla{0%,100%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.09)}}
.kart.esti .kart-ic{animation:zipla .4s ease .1s;}

/* ── Kazanma katmanı ── */
#kazanKat{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(10,20,8,.72);z-index:20;}
.kazan-kart{background:#F7EFDE;border:3px solid #C8A86A;border-radius:24px;padding:26px 22px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);}
.kazan-ikon .cic{width:46px;height:46px;color:#3F7A34;}
.kazan-bas{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:#1A3310;margin:8px 0 4px;}
.kazan-rekor{font-size:12px;font-weight:700;color:#C8A86A;letter-spacing:1.5px;text-transform:uppercase;min-height:16px;margin-bottom:10px;}
.kazan-sonuc{display:flex;justify-content:center;gap:26px;margin-bottom:18px;}
.kazan-sonuc .etiket{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8a6a2a;font-weight:600;}
.kazan-sonuc .deger{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:#1A3310;}
.kazan-btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:#2D5A27;color:#fff;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:1.5px;cursor:pointer;margin-bottom:9px;}
.kazan-btn.ikincil{background:transparent;color:#5a5348;border:1.5px solid #d8cfbc;text-decoration:none;line-height:1.2;}

.cic{display:inline-block;fill:none;color:inherit;flex:none;}
.cic-sprite{position:absolute;width:0;height:0;overflow:hidden;}
</style>
</head>
<body>

<div class="sayfa">
  <div class="ustbar">
    <button class="yuvarlak-btn" id="geriBtn" aria-label="Geri">‹</button>
    <div class="baslik">
      <h1>Cactus Hafıza</h1>
      <div class="alt">Menü kartlarını eşleştir</div>
    </div>
    <button class="yuvarlak-btn" id="sesBtn" aria-label="Ses">🔊</button>
  </div>

  <div class="hud">
    <div class="kutu"><div class="etiket">Hamle</div><div class="deger" id="hamleEl">0</div></div>
    <div class="kutu"><div class="etiket">Süre</div><div class="deger" id="sureEl">0:00</div></div>
    <div class="kutu"><div class="etiket">Rekor</div><div class="deger" id="rekorEl">—</div></div>
  </div>

  <div class="izgara" id="izgara"></div>
</div>

<div id="kazanKat">
  <div class="kazan-kart">
    <div class="kazan-ikon"><svg class="cic" viewBox="0 0 48 48"><use href="#ci-medal"></use></svg></div>
    <div class="kazan-bas">Hepsini eşledin!</div>
    <div class="kazan-rekor" id="kazanRekor"></div>
    <div class="kazan-sonuc">
      <div><div class="etiket">Hamle</div><div class="deger" id="kazanHamle">0</div></div>
      <div><div class="etiket">Süre</div><div class="deger" id="kazanSure">0:00</div></div>
    </div>
    <button class="kazan-btn" id="tekrarBtn">TEKRAR OYNA</button>
    <a class="kazan-btn ikincil" href="menu.html">Menüye göz at</a>
  </div>
</div>

<script src="oyun-odul.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
 * CACTUS HAFIZA — menü ürünleriyle kart eşleştirme
 * Her elde 12 ürünlük havuzdan 8'i seçilir (4x4). Ses, Cactus Jump'la
 * aynı Web Audio sentezi ve aynı localStorage ses tercihi.
 * ═══════════════════════════════════════════════════════════════ */

/* Havuz: gerçek menü ürünleri + menü ikon setindeki karşılıkları */
var URUNLER = [
  { id:'espresso',   ad:'Espresso',       ikon:'coffee' },
  { id:'cay',        ad:'Fincan Çay',     ikon:'tea' },
  { id:'limonata',   ad:'Limonata',       ikon:'lemon' },
  { id:'waffle',     ad:'Bubble Waffle',  ikon:'waffle' },
  { id:'sansebastian', ad:'San Sebastian', ikon:'cake' },
  { id:'brownie',    ad:'Brownie',        ikon:'choc' },
  { id:'milkshake',  ad:'Milkshake',      ikon:'juice' },
  { id:'icelatte',   ad:'Ice Latte',      ikon:'ice' },
  { id:'salep',      ad:'Salep',          ikon:'milk' },
  { id:'frozen',     ad:'Frozen',         ikon:'strawberry' },
  { id:'kelebek',    ad:'Mavi Kelebek',   ikon:'butterfly' },
  { id:'soda',       ad:'Sade Soda',      ikon:'bubbles' }
];
var CIFT_SAYISI = 8;
var REKOR_ANAHTAR = 'cactus_hafiza_rekor';

/* ── Ses: Cactus Jump'taki sentez, aynı tercih anahtarı ── */
var AC = null, sesAcik = true;
try { sesAcik = localStorage.getItem('cactus_oyun_ses') !== '0'; } catch(e){}
function sesBaslat(){
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
}
function ton(f1, f2, sure, tip, ses){
  if (!AC || !sesAcik) return;
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = tip || 'sine';
  o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + sure);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(ses, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + sure + 0.02);
}
var Ses = {
  cevir:  function(){ ton(520, 700, 0.06, 'sine', 0.14); },
  esti:   function(){ ton(1047, 1047, 0.08, 'sine', 0.18); setTimeout(function(){ ton(1568, 1568, 0.16, 'sine', 0.16); }, 70); },
  yanlis: function(){ ton(300, 180, 0.16, 'triangle', 0.14); },
  kazan:  function(){ [784, 988, 1175, 1568].forEach(function(f, i){ setTimeout(function(){ ton(f, f, i === 3 ? 0.35 : 0.13, 'sine', 0.18); }, i * 110); }); }
};

/* ── Durum ── */
var acik = null, kilit = false, hamle = 0, kalanCift = 0;
var sayac = null, saniye = 0, basladi = false;
var rekor = 0;
try { rekor = parseInt(localStorage.getItem(REKOR_ANAHTAR) || '0', 10) || 0; } catch(e){}

var izgara = document.getElementById('izgara');
var hamleEl = document.getElementById('hamleEl');
var sureEl = document.getElementById('sureEl');
var rekorEl = document.getElementById('rekorEl');

function sureYaz(s){ return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function rekorGoster(){ rekorEl.textContent = rekor > 0 ? rekor : '—'; }

function karistir(dizi){
  for (var i = dizi.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = dizi[i]; dizi[i] = dizi[j]; dizi[j] = t;
  }
  return dizi;
}

function kur(){
  acik = null; kilit = false; hamle = 0; saniye = 0; basladi = false;
  kalanCift = CIFT_SAYISI;
  if (sayac){ clearInterval(sayac); sayac = null; }
  hamleEl.textContent = '0'; sureEl.textContent = '0:00'; rekorGoster();
  document.getElementById('kazanKat').style.display = 'none';

  var secim = karistir(URUNLER.slice()).slice(0, CIFT_SAYISI);
  var desteler = karistir(secim.concat(secim).slice());
  izgara.innerHTML = '';
  desteler.forEach(function(u){
    var k = document.createElement('button');
    k.className = 'kart'; k.dataset.id = u.id;
    k.setAttribute('aria-label', 'Kapalı kart');
    k.innerHTML =
      '<div class="kart-ic">' +
        '<div class="yuz arka"><svg class="cic" viewBox="0 0 48 48"><use href="#ci-cactus"></use></svg><div class="marka">CACTUS</div></div>' +
        '<div class="yuz on"><svg class="cic" viewBox="0 0 48 48"><use href="#ci-' + u.ikon + '"></use></svg><div class="ad">' + u.ad + '</div></div>' +
      '</div>';
    k.addEventListener('click', function(){ cevir(k); });
    izgara.appendChild(k);
  });
}

function cevir(k){
  if (kilit || k === acik || k.classList.contains('esti') || k.classList.contains('acik')) return;
  sesBaslat();
  if (!basladi){
    basladi = true;
    sayac = setInterval(function(){ saniye++; sureEl.textContent = sureYaz(saniye); }, 1000);
  }
  k.classList.add('acik');
  Ses.cevir();

  if (!acik){ acik = k; return; }

  hamle++; hamleEl.textContent = String(hamle);
  var ilk = acik; acik = null;

  if (ilk.dataset.id === k.dataset.id){
    ilk.classList.add('esti'); k.classList.add('esti');
    ilk.classList.remove('acik'); k.classList.remove('acik');
    setTimeout(Ses.esti, 150);
    kalanCift--;
    if (kalanCift === 0) setTimeout(bitti, 700);
  } else {
    kilit = true;
    setTimeout(function(){
      Ses.yanlis();
      ilk.classList.add('yanlis'); k.classList.add('yanlis');
      setTimeout(function(){
        ilk.classList.remove('acik', 'yanlis'); k.classList.remove('acik', 'yanlis');
        kilit = false;
      }, 320);
    }, 550);
  }
}

function bitti(){
  if (sayac){ clearInterval(sayac); sayac = null; }
  Ses.kazan();
  var yeniRekor = rekor === 0 || hamle < rekor;
  if (yeniRekor){
    rekor = hamle;
    try { localStorage.setItem(REKOR_ANAHTAR, String(rekor)); } catch(e){}
    rekorGoster();
  }
  document.getElementById('kazanRekor').textContent = yeniRekor ? 'Yeni rekor!' : 'Rekorun: ' + rekor + ' hamle';
  document.getElementById('kazanHamle').textContent = String(hamle);
  document.getElementById('kazanSure').textContent = sureYaz(saniye);
  document.getElementById('kazanKat').style.display = 'flex';
  CactusOdul.bitti(hamle, saniye);
}

/* ── Düğmeler ── */
document.getElementById('tekrarBtn').addEventListener('click', kur);
document.getElementById('geriBtn').addEventListener('click', function(){
  if (document.referrer && history.length > 1) history.back();
  else location.href = 'oyunlar.html';
});
var sesBtn = document.getElementById('sesBtn');
function sesBtnYaz(){ sesBtn.textContent = sesAcik ? '🔊' : '🔇'; }
sesBtn.addEventListener('click', function(){
  sesAcik = !sesAcik;
  try { localStorage.setItem('cactus_oyun_ses', sesAcik ? '1' : '0'); } catch(e){}
  sesBaslat(); if (sesAcik) Ses.esti();
  sesBtnYaz();
});
sesBtnYaz();

kur();
</script>
<script>CactusOdul.kur({ oyun:'hafiza', esik:12, tersYon:true, birim:'hamle' });</script>
</body>
</html>
