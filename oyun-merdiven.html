<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Kahve Merdiveni — Cactus Coffee</title>
<meta name="theme-color" content="#F0C78C">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  min-height:100%;
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,#FCEFD3 0%,#F7DDB0 55%,#F0C78C 100%);
  background-attachment:fixed;
  color:#14271D;
  user-select:none;-webkit-user-select:none;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
}
.sayfa{max-width:440px;margin:0 auto;}

.ustbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.yuvarlak-btn{
  width:38px;height:38px;border-radius:50%;border:2.5px solid #1A3310;
  background:rgba(247,239,222,.92);color:#1A3310;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.baslik{text-align:center;}
.baslik h1{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:2px;color:#1A3310;text-transform:uppercase;}
.baslik .alt{font-size:11px;color:#8a6a2a;letter-spacing:1px;margin-top:2px;}

.hud{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.hud .kutu{
  background:rgba(247,239,222,.85);border:1.5px solid #C8A86A;border-radius:12px;
  padding:7px 14px;text-align:center;min-width:86px;
}
.hud .etiket{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8a6a2a;font-weight:600;}
.hud .deger{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:#1A3310;margin-top:1px;}
.hud button.kutu{cursor:pointer;font-family:inherit;}
.hud button .deger{font-size:17px;}

/* ── Tahta ── */
#tahta{
  position:relative;width:100%;aspect-ratio:1;
  background:rgba(180,155,108,.35);border:2.5px solid #C8A86A;border-radius:16px;
  touch-action:none;
}
.hucre{position:absolute;background:rgba(247,239,222,.45);border-radius:10px;}
.tas{
  position:absolute;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .13s ease-out;
  box-shadow:0 2px 6px rgba(26,51,16,.18);
  z-index:2;
}
.tas .cic{width:34%;height:34%;}
.tas .ad{font-weight:700;font-size:11px;text-align:center;line-height:1.1;padding:0 3px;}
@keyframes tasYeni{0%{transform:scale(0)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.tas.yeni{animation:tasYeni .16s ease-out;}
@keyframes tasPop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.tas.pop{animation:tasPop .2s ease-out;z-index:3;}

/* ── Merdiven şeridi ── */
.merdiven{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:16px;}
.basamak{
  display:flex;align-items:center;gap:4px;
  font-size:9.5px;font-weight:600;color:#8a6a2a;
  background:rgba(247,239,222,.6);border:1px solid rgba(200,168,106,.5);
  border-radius:20px;padding:4px 9px;opacity:.55;
}
.basamak .cic{width:12px;height:12px;}
.basamak.acildi{opacity:1;color:#1A3310;border-color:#C8A86A;}
.basamak.zirve.acildi{background:#1A3310;color:#F7EFDE;}

.ipucu{text-align:center;font-size:11px;color:#8a6a2a;margin-top:12px;letter-spacing:.3px;}

/* ── Katmanlar ── */
.kat{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(10,20,8,.72);z-index:20;}
.kat-kart{background:#F7EFDE;border:3px solid #C8A86A;border-radius:24px;padding:26px 22px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);}
.kat-ikon{font-size:40px;line-height:1;margin-bottom:8px;}
.kat-ikon .cic{width:46px;height:46px;color:#3F7A34;}
.kat-bas{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:#1A3310;margin-bottom:6px;}
.kat-metin{font-size:13px;color:#5a5348;line-height:1.6;margin-bottom:18px;}
.kat-btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:#2D5A27;color:#fff;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:1.5px;cursor:pointer;margin-bottom:9px;}
.kat-btn.ikincil{background:transparent;color:#5a5348;border:1.5px solid #d8cfbc;}

.cic{display:inline-block;fill:none;color:inherit;flex:none;}
.cic-sprite{position:absolute;width:0;height:0;overflow:hidden;}
</style>
</head>
<body>

<!-- İkonlar: menüdeki Cactus ikon setinden alt küme -->

<div class="sayfa">
  <div class="ustbar">
    <button class="yuvarlak-btn" id="geriBtn" aria-label="Geri">‹</button>
    <div class="baslik">
      <h1>Kahve Merdiveni</h1>
      <div class="alt">Birleştir, menüde yüksel</div>
    </div>
    <button class="yuvarlak-btn" id="sesBtn" aria-label="Ses">🔊</button>
  </div>

  <div class="hud">
    <div class="kutu"><div class="etiket">Skor</div><div class="deger" id="skorEl">0</div></div>
    <div class="kutu"><div class="etiket">Rekor</div><div class="deger" id="rekorEl">0</div></div>
    <button class="kutu" id="yeniBtn"><div class="etiket">Sıfırla</div><div class="deger">↺</div></button>
  </div>

  <div id="tahta"></div>

  <div class="merdiven" id="merdiven"></div>
  <p class="ipucu">Kaydır (ya da ok tuşları) — aynı iki ürün birleşince bir üst ürüne dönüşür.</p>

<div class="kat" id="zirveKat">
  <div class="kat-kart">
    <div class="kat-ikon"><svg class="cic" viewBox="0 0 48 48"><use href="#ci-medal"></use></svg></div>
    <div class="kat-bas">Zirveye ulaştın!</div>
    <div class="kat-metin">San Sebastian'ı yaptın — menünün tepesindesin. İstersen devam et, skorunu büyüt.</div>
    <button class="kat-btn" id="devamBtn">DEVAM ET</button>
    <button class="kat-btn ikincil" id="zirveYeniBtn">Yeniden başla</button>
  </div>
</div>

<div class="kat" id="bittiKat">
  <div class="kat-kart">
    <div class="kat-ikon">🌵</div>
    <div class="kat-bas">Hamle kalmadı</div>
    <div class="kat-metin" id="bittiMetin"></div>
    <button class="kat-btn" id="bittiYeniBtn">TEKRAR OYNA</button>
    <a class="kat-btn ikincil" href="oyunlar.html" style="text-decoration:none;line-height:1.2;display:block;">Diğer oyunlar</a>

<script src="oyun-odul.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
 * KAHVE MERDİVENİ — 2048'in Cactus sürümü
 * Aynı iki ürün birleşince menüde bir üst basamağa çıkar:
 * Su → Espresso → ... → San Sebastian (zirve). Ses, diğer oyunlarla
 * aynı Web Audio sentezi ve aynı localStorage tercihi.
 * ═══════════════════════════════════════════════════════════════ */

var BASAMAKLAR = [
  { ad:'Su',          ikon:'droplet', zemin:'#EFE7D6', yazi:'#5a5348' },
  { ad:'Espresso',    ikon:'coffee',  zemin:'#E3D2AC', yazi:'#3d3427' },
  { ad:'Cortado',     ikon:'spoon',   zemin:'#D9C08C', yazi:'#3d3427' },
  { ad:'Latte',       ikon:'milk',    zemin:'#CFAE6E', yazi:'#2e2113' },
  { ad:'Mocha',       ikon:'choc',    zemin:'#B98A50', yazi:'#FCEFD3' },
  { ad:'Caramel',     ikon:'honey',   zemin:'#C8A86A', yazi:'#2e2113' },
  { ad:'Ice Latte',   ikon:'ice',     zemin:'#5CA34C', yazi:'#F7EFDE' },
  { ad:'Milkshake',   ikon:'juice',   zemin:'#3F7A34', yazi:'#F7EFDE' },
  { ad:'San Seb.',    ikon:'cake',    zemin:'#1A3310', yazi:'#E8C47A' }
];
var N = 4, BOSLUK = 10;
var REKOR_ANAHTAR = 'cactus_merdiven_rekor';

/* ── Ses ── */
var AC = null, sesAcik = true;
try { sesAcik = localStorage.getItem('cactus_oyun_ses') !== '0'; } catch(e){}
function sesBaslat(){
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
}
function ton(f1, f2, sure, tip, ses){
  if (!AC || !sesAcik) return;
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = tip || 'sine';
  o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + sure);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(ses, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + sure + 0.02);
}
var Ses = {
  kaydir: function(){ ton(340, 300, 0.05, 'sine', 0.10); },
  birles: function(t){ var f = 520 + t * 90; ton(f, f * 1.5, 0.11, 'sine', 0.18); },
  zirve:  function(){ [784, 988, 1175, 1568].forEach(function(f, i){ setTimeout(function(){ ton(f, f, i === 3 ? 0.35 : 0.13, 'sine', 0.18); }, i * 110); }); },
  bitti:  function(){ ton(300, 140, 0.4, 'triangle', 0.16); }
};

/* ── Durum ── */
var _odulBas = performance.now();
var taslar = [], siraNo = 1, skor = 0, kilit = false, oyunBitti = false;
var zirveGosterildi = false, enYuksek = 1;
var rekor = 0;
try { rekor = parseInt(localStorage.getItem(REKOR_ANAHTAR) || '0', 10) || 0; } catch(e){}

var tahta = document.getElementById('tahta');
var skorEl = document.getElementById('skorEl');
var rekorEl = document.getElementById('rekorEl');
var elMap = {};   // taş id → DOM düğümü
var S = 0;        // hücre boyutu (px)

function olc(){
  S = (tahta.clientWidth - BOSLUK * (N + 1)) / N;
  // Arka plan hücreleri
  tahta.querySelectorAll('.hucre').forEach(function(h){ h.remove(); });
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++){
    var h = document.createElement('div');
    h.className = 'hucre';
    h.style.width = h.style.height = S + 'px';
    h.style.left = (BOSLUK + c * (S + BOSLUK)) + 'px';
    h.style.top = (BOSLUK + r * (S + BOSLUK)) + 'px';
    tahta.appendChild(h);
  }
  Object.keys(elMap).forEach(function(id){ tasYerlestir(elMap[id], tasBul(+id)); });
}
window.addEventListener('resize', olc);

function tasBul(id){ for (var i = 0; i < taslar.length; i++) if (taslar[i].id === id) return taslar[i]; return null; }

function tasYerlestir(el, t){
  if (!el || !t) return;
  el.style.width = el.style.height = S + 'px';
  el.style.transform = 'translate(' + (BOSLUK + t.c * (S + BOSLUK)) + 'px,' + (BOSLUK + t.r * (S + BOSLUK)) + 'px)';
}

function tasGorunum(el, t){
  var b = BASAMAKLAR[t.t - 1];
  el.style.background = b.zemin;
  el.style.color = b.yazi;
  el.innerHTML = '<svg class="cic" viewBox="0 0 48 48"><use href="#ci-' + b.ikon + '"></use></svg><div class="ad">' + b.ad + '</div>';
}

function ciz(){
  // Silinenleri kaldır
  Object.keys(elMap).forEach(function(id){
    if (!tasBul(+id)){ elMap[id].remove(); delete elMap[id]; }
  });
  taslar.forEach(function(t){
    var el = elMap[t.id];
    if (!el){
      el = document.createElement('div');
      el.className = 'tas';
      tasGorunum(el, t);
      tasYerlestir(el, t);
      if (t.yeni){ el.classList.add('yeni'); delete t.yeni; }
      tahta.appendChild(el);
      elMap[t.id] = el;
    } else {
      tasYerlestir(el, t);
      if (t.pop){
        tasGorunum(el, t);
        el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
        delete t.pop;
      }
    }
  });
  skorEl.textContent = String(skor);
  rekorEl.textContent = String(rekor);
  merdivenCiz();
}

function merdivenCiz(){
  var m = document.getElementById('merdiven');
  m.innerHTML = '';
  BASAMAKLAR.forEach(function(b, i){
    var d = document.createElement('div');
    d.className = 'basamak' + (i + 1 <= enYuksek ? ' acildi' : '') + (i === BASAMAKLAR.length - 1 ? ' zirve' : '');
    d.innerHTML = '<svg class="cic" viewBox="0 0 48 48"><use href="#ci-' + b.ikon + '"></use></svg>' + b.ad;
    m.appendChild(d);
  });
}

function bosHucreler(){
  var dolu = {};
  taslar.forEach(function(t){ dolu[t.r + '_' + t.c] = 1; });
  var v = [];
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++)
    if (!dolu[r + '_' + c]) v.push({ r: r, c: c });
  return v;
}

function tasEkle(){
  var v = bosHucreler();
  if (!v.length) return;
  var p = v[Math.floor(Math.random() * v.length)];
  taslar.push({ id: siraNo++, r: p.r, c: p.c, t: Math.random() < 0.9 ? 1 : 2, yeni: true });
}

function hamleVar(){
  if (bosHucreler().length) return true;
  var grid = {};
  taslar.forEach(function(t){ grid[t.r + '_' + t.c] = t.t; });
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++){
    var v = grid[r + '_' + c];
    if (grid[r + '_' + (c + 1)] === v || grid[(r + 1) + '_' + c] === v) return true;
  }
  return false;
}

function hamle(dr, dc){
  if (kilit || oyunBitti) return;
  var grid = [];
  for (var i = 0; i < N; i++) grid.push([null, null, null, null]);
  taslar.forEach(function(t){ grid[t.r][t.c] = t; });

  var hareket = false, birlesenler = [];
  for (var a = 0; a < N; a++){
    var sira = [];
    for (var b = 0; b < N; b++){
      var r = dc !== 0 ? a : (dr > 0 ? N - 1 - b : b);
      var c = dc !== 0 ? (dc > 0 ? N - 1 - b : b) : a;
      if (grid[r][c]) sira.push(grid[r][c]);
    }
    var yer = 0, onceki = null;
    for (var k = 0; k < sira.length; k++){
      var t = sira[k];
      if (onceki && onceki.t === t.t && !onceki.birlesti){
        t.r = onceki.r; t.c = onceki.c; t.sil = true;
        onceki.birlesti = true; birlesenler.push(onceki);
        hareket = true;
      } else {
        var nr = dc !== 0 ? a : (dr > 0 ? N - 1 - yer : yer);
        var nc = dc !== 0 ? (dc > 0 ? N - 1 - yer : yer) : a;
        if (t.r !== nr || t.c !== nc) hareket = true;
        t.r = nr; t.c = nc;
        onceki = t; yer++;
      }
    }
  }
  taslar.forEach(function(t){ delete t.birlesti; });
  if (!hareket) return;

  kilit = true;
  sesBaslat();
  Ses.kaydir();
  ciz();  // transform geçişi kaymayı canlandırır

  setTimeout(function(){
    taslar = taslar.filter(function(t){ return !t.sil; });
    var enB = 0;
    birlesenler.forEach(function(t){
      t.t++; t.pop = true;
      skor += Math.pow(2, t.t);
      if (t.t > enB) enB = t.t;
      if (t.t > enYuksek) enYuksek = t.t;
    });
    if (skor > rekor){
      rekor = skor;
      try { localStorage.setItem(REKOR_ANAHTAR, String(rekor)); } catch(e){}
    }
    if (enB) Ses.birles(enB);
    tasEkle();
    ciz();
    kilit = false;
    if (enB === BASAMAKLAR.length && !zirveGosterildi){
      zirveGosterildi = true;
      Ses.zirve();
      document.getElementById('zirveKat').style.display = 'flex';
    } else if (!hamleVar()){
      oyunBitti = true;
      Ses.bitti();
      document.getElementById('bittiMetin').textContent =
        'Skorun ' + skor + '. En yükseği ' + BASAMAKLAR[enYuksek - 1].ad + ' yaptın.';
      document.getElementById('bittiKat').style.display = 'flex';
      CactusOdul.bitti(skor, (performance.now() - _odulBas) / 1000);
    }
  }, 140);
}

function yeniOyun(){
  taslar = []; skor = 0; oyunBitti = false; kilit = false;
  zirveGosterildi = false; enYuksek = 1;
  document.getElementById('zirveKat').style.display = 'none';
  document.getElementById('bittiKat').style.display = 'none';
  tasEkle(); tasEkle();
  ciz();
}

/* ── Girdi ── */
window.addEventListener('keydown', function(e){
  var y = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] }[e.key];
  if (y){ e.preventDefault(); hamle(y[0], y[1]); }
});
var dokunX = 0, dokunY = 0;

  var dx = e.clientX - dokunX, dy = e.clientY - dokunY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) hamle(0, dx > 0 ? 1 : -1);
  else hamle(dy > 0 ? 1 : -1, 0);
});
