<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0e0e0e">
<title>Cactus Coffee — Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--gold:#b8965a;--dark:#0e0e0e;--cream:#f7f4ef;--border:#e8e2d9;--mist:#999;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;overflow-x:hidden;}

/* ── HEADER ── */
.qr-header{background:var(--dark);color:#fff;padding:28px 20px 22px;text-align:center;position:relative;}
.qr-logo{font-family:'Fraunces',serif;font-size:28px;font-weight:300;letter-spacing:8px;text-transform:uppercase;margin-bottom:4px;}
.qr-tagline{font-size:9px;letter-spacing:4px;color:#666;text-transform:uppercase;}

/* ── SUBE SWITCH ── */
.sube-bar{display:flex;background:#fff;border-bottom:1px solid var(--border);}
.sube-btn{flex:1;padding:15px 10px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;color:var(--mist);cursor:pointer;transition:all .25s;font-weight:400;}
.sube-btn.on{color:var(--dark);border-bottom-color:var(--dark);font-weight:500;}

/* ── KAT TABS ── */
.kat-bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.kat-bar::-webkit-scrollbar{display:none;}
.kat-bar-inner{display:inline-flex;padding:0 12px;gap:4px;}
.kat-btn{padding:13px 16px;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;color:var(--mist);cursor:pointer;white-space:nowrap;transition:all .2s;font-weight:400;}
.kat-btn.on{color:var(--dark);border-bottom-color:var(--gold);}

/* ── MENÜ BODY ── */
.menu-body{padding:0 0 80px;}

/* ── KAT SECTION ── */
.kat-sec{padding:32px 16px 8px;}
.kat-title{font-family:'Fraunces',serif;font-size:28px;font-weight:300;letter-spacing:1px;margin-bottom:4px;}
.kat-line{width:32px;height:1px;background:var(--gold);margin:8px 0 20px;}

/* ── ÜRÜN KART ── */
.urun-list{display:flex;flex-direction:column;gap:1px;}
.urun-kart{background:#fff;display:flex;align-items:center;gap:14px;padding:16px;border-radius:0;transition:background .15s;}
.urun-kart:active{background:#f0ece6;}
.urun-foto-wrap{width:72px;height:72px;flex-shrink:0;border-radius:6px;overflow:hidden;background:#f0ece6;}
.urun-foto-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.urun-foto-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;}
.urun-bilgi{flex:1;min-width:0;}
.urun-ad{font-family:'Fraunces',serif;font-size:18px;font-weight:400;line-height:1.2;margin-bottom:4px;}
.urun-acik{font-size:11px;color:#888;line-height:1.5;font-weight:300;margin-bottom:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.urun-fiyat{font-size:14px;font-weight:600;color:var(--dark);white-space:nowrap;align-self:flex-start;padding-top:2px;}

/* ── POPUP ── */
.pop-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s;display:flex;align-items:flex-end;}
.pop-bg.on{opacity:1;pointer-events:auto;}
.pop-kart{background:#fff;width:100%;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);padding-bottom:env(safe-area-inset-bottom,16px);}
.pop-bg.on .pop-kart{transform:translateY(0);}
.pop-foto{width:100%;height:220px;object-fit:cover;display:block;background:#f0ece6;}
.pop-foto-emoji{height:160px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#f7f4ef;}
.pop-ici{padding:22px 20px 20px;}
.pop-ust{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.pop-ad{font-family:'Fraunces',serif;font-size:26px;font-weight:400;line-height:1.15;flex:1;}
.pop-fiyat{font-size:18px;font-weight:700;color:var(--dark);white-space:nowrap;}
.pop-acik{font-size:13px;color:#777;line-height:1.75;font-weight:300;margin-bottom:20px;}
.pop-kapat{display:block;width:100%;padding:14px;background:var(--dark);color:#fff;border:none;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:8px;}

/* ── LOADING ── */
.qr-loading{text-align:center;padding:80px 20px;color:var(--mist);}
.qr-loading-dot{display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;animation:ld .8s ease-in-out infinite;}
.qr-loading-dot:nth-child(2){animation-delay:.16s;}
.qr-loading-dot:nth-child(3){animation-delay:.32s;}
@keyframes ld{0%,80%,100%{transform:scale(0.6);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* ── FOOTER ── */
.qr-footer{text-align:center;padding:16px;font-size:10px;color:#ccc;letter-spacing:2px;text-transform:uppercase;background:#fff;border-top:1px solid var(--border);}
</style>
<script>(function(){try{var k="cv_"+new Date().toISOString().split("T")[0],y=!localStorage.getItem(k);if(y)localStorage.setItem(k,"1");fetch("https://cactus-rapor-api.batuhanbulut.workers.dev/ziyaret/kaydet",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sayfa:location.pathname,yeni:y})}).catch(function(){});}catch(e){}})();</script>
</head>
<body>

<div class="qr-header">
  <div class="qr-logo">CACTUS</div>
  <div class="qr-tagline">Specialty Coffee</div>
</div>

<div class="sube-bar">
  <button class="sube-btn on" id="btn-fsm" onclick="subeGec('fsm')">🏙 FSM</button>
  <button class="sube-btn" id="btn-podyum" onclick="subeGec('podyum')">🌿 Podyumpark</button>
</div>

<div class="kat-bar"><div class="kat-bar-inner" id="katBar"></div></div>

<div class="menu-body" id="menuBody">
  <div class="qr-loading">
    <span class="qr-loading-dot"></span>
    <span class="qr-loading-dot"></span>
    <span class="qr-loading-dot"></span>
  </div>
</div>

<!-- Ürün Popup -->
<div class="pop-bg" id="popBg" onclick="if(event.target===this)popKapat()">
  <div class="pop-kart" id="popKart"></div>
</div>

<div class="qr-footer">Cactus Coffee · Bursa</div>

<script>
var _menuData = null;
var _aktifSube = 'fsm';
var _aktifKat = null;

// URL'den şubeyi oku
(function(){
  var p = new URLSearchParams(location.search);
  var s = p.get('sube');
  if(s === 'podyum') _aktifSube = 'podyum';
})();

function subeGec(sube){
  _aktifSube = sube;
  document.getElementById('btn-fsm').classList.toggle('on', sube==='fsm');
  document.getElementById('btn-podyum').classList.toggle('on', sube==='podyum');
  if(_menuData) render(_menuData[sube]||{});
}

function menuCek(){
  fetch('https://raw.githubusercontent.com/cactuscafes/cactus-kafe/main/menu-data.json?t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(data){
      _menuData = data;
      subeGec(_aktifSube);
    })
    .catch(function(){
      document.getElementById('menuBody').innerHTML='<div class="qr-loading" style="color:#c0392b;">Menü yüklenemedi. Lütfen sayfayı yenileyin.</div>';
    });
}

function render(sube){
  var katBar = document.getElementById('katBar');
  var body = document.getElementById('menuBody');
  katBar.innerHTML = '';
  body.innerHTML = '';

  var katlar = Object.values(sube).filter(function(k){
    return k && k.urunler && k.urunler.filter(function(u){return !u.gizli;}).length > 0;
  });

  if(!katlar.length){
    body.innerHTML='<div class="qr-loading">Henüz ürün eklenmemiş.</div>';
    return;
  }

  // Kat butonları
  katlar.forEach(function(kat, i){
    var btn = document.createElement('button');
    btn.className = 'kat-btn' + (i===0?' on':'');
    btn.textContent = kat.label || kat.id;
    btn.dataset.kat = kat.id;
    btn.onclick = function(){
      document.querySelectorAll('.kat-btn').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      var sec = document.getElementById('kat-'+kat.id);
      if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
    };
    katBar.appendChild(btn);
  });

  // Ürün listesi
  katlar.forEach(function(kat){
    var urunler = kat.urunler.filter(function(u){return !u.gizli;});
    if(!urunler.length) return;

    var sec = document.createElement('div');
    sec.className = 'kat-sec';
    sec.id = 'kat-'+kat.id;

    var title = document.createElement('div');
    title.className = 'kat-title';
    title.textContent = kat.label || kat.id;
    var line = document.createElement('div');
    line.className = 'kat-line';

    var liste = document.createElement('div');
    liste.className = 'urun-list';

    urunler.forEach(function(u){
      var kart = document.createElement('div');
      kart.className = 'urun-kart';
      kart.onclick = function(){ popAc(u); };

      var fotoWrap = document.createElement('div');
      fotoWrap.className = 'urun-foto-wrap';
      if(u.foto){
        var img = document.createElement('img');
        img.src = u.foto;
        img.loading = 'lazy';
        img.alt = u.ad;
        img.onerror = function(){
          fotoWrap.innerHTML = '<div class="urun-foto-emoji">'+(u.emoji||'☕')+'</div>';
        };
        fotoWrap.appendChild(img);
      } else {
        fotoWrap.innerHTML = '<div class="urun-foto-emoji">'+(u.emoji||'☕')+'</div>';
      }

      var bilgi = document.createElement('div');
      bilgi.className = 'urun-bilgi';
      bilgi.innerHTML = '<div class="urun-ad">'+(u.emoji?u.emoji+' ':'')+u.ad+'</div>'
        +(u.aciklama?'<div class="urun-acik">'+u.aciklama+'</div>':'');

      var fiyat = document.createElement('div');
      fiyat.className = 'urun-fiyat';
      fiyat.textContent = '₺'+u.fiyat;

      kart.appendChild(fotoWrap);
      kart.appendChild(bilgi);
      kart.appendChild(fiyat);
      liste.appendChild(kart);
    });

    sec.appendChild(title);
    sec.appendChild(line);
    sec.appendChild(liste);
    body.appendChild(sec);
  });

  // Scroll ile aktif kat takibi
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        var id = e.target.id.replace('kat-','');
        document.querySelectorAll('.kat-btn').forEach(function(b){
          b.classList.toggle('on', b.dataset.kat===id);
        });
        var aktifBtn = katBar.querySelector('[data-kat="'+id+'"]');
        if(aktifBtn) aktifBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
      }
    });
  },{rootMargin:'-20% 0px -70% 0px'});

  document.querySelectorAll('.kat-sec').forEach(function(s){observer.observe(s);});
}

function popAc(u){
  var kart = document.getElementById('popKart');
  var foto = u.foto
    ? '<img class="pop-foto" src="'+u.foto+'" alt="'+u.ad+'" onerror="this.outerHTML=\'<div class=pop-foto-emoji>'+(u.emoji||'☕')+'</div>\'">'
    : '<div class="pop-foto-emoji">'+(u.emoji||'☕')+'</div>';
  kart.innerHTML = foto
    +'<div class="pop-ici">'
    +'<div class="pop-ust"><div class="pop-ad">'+(u.emoji?u.emoji+' ':'')+u.ad+'</div><div class="pop-fiyat">₺'+u.fiyat+'</div></div>'
    +(u.aciklama?'<div class="pop-acik">'+u.aciklama+'</div>':'')
    +'<button class="pop-kapat" onclick="popKapat()">Kapat</button>'
    +'</div>';
  document.getElementById('popBg').classList.add('on');
  document.body.style.overflow='hidden';
}

function popKapat(){
  document.getElementById('popBg').classList.remove('on');
  document.body.style.overflow='';
}

// Başlat
document.getElementById('btn-'+_aktifSube).classList.add('on');
if(_aktifSube==='podyum') document.getElementById('btn-fsm').classList.remove('on');
menuCek();
</script>
</body>
</html>
