name = "cactus-kafe"
compatibility_date = "2026-04-26"
main = "src/index.js"

assets = { directory = ".", binding = "ASSETS" }

compatibility_flags = [ "nodejs_compat" ]

# Event-sourced adisyon sync — Square/Toast tarzı append-only event log
[[d1_databases]]
binding = "ADISYON_DB"
database_name = "cactus-adisyon-events"
database_id = "3a5ac73e-326c-4eff-9dc8-a5de49f18d44"

[observability]
enabled = true

# NOT: cron trigger'ları asset'li worker'da kaydolmuyor (wrangler 3 ve 4 ile
# denendi, schedule sessizce atlanıyor). Vardiya zamanlayıcısı ayrı worker'da:
# wrangler-cron.toml (cactus-kafe-cron).

[env.production]
vars = { ENVIRONMENT = "production" }

[[routes]]
pattern = "cactuscafes.com"
custom_domain = true

[[routes]]
pattern = "www.cactuscafes.com"
custom_domain = true

[env.staging]
vars = { ENVIRONMENT = "staging" }
