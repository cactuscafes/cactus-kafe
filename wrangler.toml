name = "cactus-kafe"
compatibility_date = "2026-04-26"
main = "src/index.js"

assets = { directory = ".", binding = "ASSETS" }

compatibility_flags = [ "nodejs_compat" ]

# Event-sourced adisyon sync — Square/Toast tarzı append-only event log
[[d1_databases]]
binding = "ADISYON_DB"
database_name = "cactus-adisyon-events"
database_id = "3a5ac73e-326c-4eff-9dc8-a5de49f18d44"

[observability]
enabled = true

# Vardiya bildirim otomasyonu: 10 dk'da bir uyan → gece özeti (05:00-05:30 İst)
# ve geç kalma kontrolü (admin'de ayarlanan saat). Bkz. src/index.js scheduled().
[triggers]
crons = ["*/10 * * * *"]

[env.production]
vars = { ENVIRONMENT = "production" }

[[routes]]
pattern = "cactuscafes.com"
custom_domain = true

[[routes]]
pattern = "www.cactuscafes.com"
custom_domain = true

[env.staging]
vars = { ENVIRONMENT = "staging" }
